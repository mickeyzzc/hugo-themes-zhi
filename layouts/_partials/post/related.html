{{- /* related.html — related posts based on Hugo Related Content */ -}}
{{- $related := site.RegularPages.Related . | first 5 -}}
{{- with $related -}}
<aside class="post-related" aria-label="{{ i18n "relatedPosts" }}">
  <h2 class="post-related__title">{{ i18n "relatedPosts" }}</h2>
  <ul class="post-related__list">
    {{- range . -}}
    <li class="post-related__item">
      <a href="{{ .RelPermalink }}" class="post-related__link">{{ .Title }}
        <time class="post-related__date" datetime='{{ .Date | time.Format "2006-01-02T15:04:05-07:00" }}'>{{ .Date | time.Format "2006-01-02" }}</time>
      </a>
    </li>
    {{- end -}}
  </ul>
</aside>
{{- end -}}
