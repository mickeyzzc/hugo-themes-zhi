{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="VictoriaMetrics Cluster Data Flow Animation">
  <rect width="720" height="380" fill="#fafafa" rx="8"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">VictoriaMetrics Cluster: Write & Query Pipeline</text>
  <!-- vminsert -->
  <rect x="30" y="55" width="140" height="55" rx="8" fill="#2196F3"/>
  <text x="100" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">vminsert</text>
  <text x="100" y="96" text-anchor="middle" font-size="11" fill="#E3F2FD" font-family="system-ui,sans-serif">Write Router</text>
  <!-- vmstorage cluster -->
  <rect x="220" y="40" width="280" height="110" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#2E7D32" font-weight="600" font-family="system-ui,sans-serif">vmstorage Cluster (Shared-Nothing)</text>
  <rect x="232" y="65" width="60" height="30" rx="4" fill="#4CAF50"/>
  <text x="262" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">Node A</text>
  <rect x="300" y="65" width="60" height="30" rx="4" fill="#4CAF50"/>
  <text x="330" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">Node B</text>
  <rect x="370" y="65" width="60" height="30" rx="4" fill="#4CAF50"/>
  <text x="400" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">Node C</text>
  <rect x="438" y="65" width="60" height="30" rx="4" fill="#4CAF50"/>
  <text x="468" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">Node D</text>
  <!-- vmselect -->
  <rect x="550" y="55" width="140" height="55" rx="8" fill="#2196F3"/>
  <text x="620" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">vmselect</text>
  <text x="620" y="96" text-anchor="middle" font-size="11" fill="#E3F2FD" font-family="system-ui,sans-serif">Query Handler</text>
  <!-- Phase 1 (15-35%): Write flow -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.15;0.97;1" dur="14s" repeatCount="indefinite"/>
    <text x="15" y="50" text-anchor="start" font-size="11" fill="#E65100" font-weight="600" font-family="system-ui,sans-serif">Write Request →</text>
    <line x1="100" y1="50" x2="100" y2="78" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="3,2">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="170" y1="82" x2="218" y2="82" stroke="#1565C0" stroke-width="2.5"/>
    <text x="194" y="76" text-anchor="middle" font-size="9" fill="#1565C0" font-weight="500" font-family="system-ui,sans-serif">Consistent Hash</text>
  </g>
  <!-- Phase 2 (35-55%): Query flow -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.35;0.97;1" dur="14s" repeatCount="indefinite"/>
    <text x="705" y="50" text-anchor="end" font-size="11" fill="#7B1FA2" font-weight="600" font-family="system-ui,sans-serif">← Query Request</text>
    <line x1="620" y1="50" x2="620" y2="78" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="3,2">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="550" y1="82" x2="502" y2="82" stroke="#7B1FA2" stroke-width="2.5"/>
    <text x="526" y="76" text-anchor="middle" font-size="9" fill="#7B1FA2" font-weight="500" font-family="system-ui,sans-serif">Fan-out Query</text>
  </g>
  <!-- Phase 3 (55-75%): Response flow -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.55;0.97;1" dur="14s" repeatCount="indefinite"/>
    <line x1="502" y1="115" x2="550" y2="115" stroke="#4CAF50" stroke-width="2.5"/>
    <text x="526" y="108" text-anchor="middle" font-size="9" fill="#2E7D32" font-weight="500" font-family="system-ui,sans-serif">Return Results</text>
  </g>
  <!-- Phase 4 (75-97%): Summary -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.75;0.97;1" dur="14s" repeatCount="indefinite"/>
    <line x1="20" y1="170" x2="700" y2="170" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="60" y="185" width="600" height="85" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
    <text x="360" y="210" text-anchor="middle" font-size="13" fill="#333" font-family="system-ui,sans-serif">vminsert distributes writes to vmstorage via consistent hashing</text>
    <text x="360" y="232" text-anchor="middle" font-size="13" fill="#333" font-family="system-ui,sans-serif">vmselect fans out queries to all vmstorage nodes in parallel</text>
    <text x="360" y="254" text-anchor="middle" font-size="12" fill="#7B1FA2" font-weight="600" font-family="system-ui,sans-serif">Shared-Nothing: nodes don't communicate, each independently scalable</text>
  </g>
</svg>
{{- else -}}
<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="VictoriaMetrics 集群数据流动画">
  <rect width="720" height="380" fill="#fafafa" rx="8"/>

  <!-- vminsert -->
  <rect x="30" y="55" width="140" height="55" rx="8" fill="#2196F3"/>

  <rect x="300" y="65" width="60" height="30" rx="4" fill="#4CAF50"/>

  <text x="400" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">Node C</text>
  <rect x="438" y="65" width="60" height="30" rx="4" fill="#4CAF50"/>
  <text x="468" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">Node D</text>

  <!-- Phase 1 (15-35%): Write flow -->
  <g opacity="0">

    <line x1="100" y1="50" x2="100" y2="78" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="3,2">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="170" y1="82" x2="218" y2="82" stroke="#1565C0" stroke-width="2.5"/>

  <!-- Phase 2 (35-55%): Query flow -->
  <g opacity="0">

    <line x1="620" y1="50" x2="620" y2="78" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="3,2">

    </line>
    <line x1="550" y1="82" x2="502" y2="82" stroke="#7B1FA2" stroke-width="2.5"/>

  </g>
  <!-- Phase 3 (55-75%): Response flow -->
  <g opacity="0">

    <line x1="502" y1="115" x2="550" y2="115" stroke="#4CAF50" stroke-width="2.5"/>
    <text x="526" y="108" text-anchor="middle" font-size="9" fill="#2E7D32" font-weight="500" font-family="system-ui,sans-serif">返回结果</text>
  </g>

  <g opacity="0">

    <rect x="60" y="185" width="600" height="85" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
    <text x="360" y="210" text-anchor="middle" font-size="13" fill="#333" font-family="system-ui,sans-serif">vminsert 按一致性哈希将写入分发到 vmstorage 节点</text>

    <text x="360" y="254" text-anchor="middle" font-size="12" fill="#7B1FA2" font-weight="600" font-family="system-ui,sans-serif">Shared-Nothing：节点间互不通信，独立扩展</text>

</svg>
