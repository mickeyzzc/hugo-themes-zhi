{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="TSDB Level Downsampling Animation">
  <rect width="720" height="420" fill="#fafafa" rx="8"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">TSDB Level Downsampling: Resolution Decreases Over Time</text>
  <!-- Level 0: Raw data -->
  <rect x="20" y="50" width="680" height="32" rx="4" fill="#FFF3E0"/>
  <text x="120" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100" font-family="system-ui,sans-serif">Raw Data (15s interval)</text>
  <g>
    <circle cx="240" cy="66" r="5" fill="#FF9800"/>
    <circle cx="285" cy="66" r="5" fill="#FF9800"/>
    <circle cx="330" cy="66" r="5" fill="#FF9800"/>
    <circle cx="375" cy="66" r="5" fill="#FF9800"/>
    <circle cx="420" cy="66" r="5" fill="#FF9800"/>
    <circle cx="465" cy="66" r="5" fill="#FF9800"/>
    <circle cx="510" cy="66" r="5" fill="#FF9800"/>
    <circle cx="555" cy="66" r="5" fill="#FF9800"/>
  </g>
  <!-- Arrow L0 to L1 -->
  <line x1="360" y1="86" x2="360" y2="108" stroke="#E0E0E0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.12;0.97;1" dur="14s" repeatCount="indefinite"/>
    <text x="360" y="102" text-anchor="middle" font-size="9" fill="#9E9E9E" font-family="system-ui,sans-serif">Compaction</text>
  </g>
  <!-- Level 1: 5m aggregation -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.12;0.97;1" dur="14s" repeatCount="indefinite"/>
    <rect x="20" y="110" width="680" height="32" rx="4" fill="#E3F2FD"/>
    <text x="120" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0" font-family="system-ui,sans-serif">5-Minute Rollup (avg/min/max)</text>
    <rect x="250" y="115" width="70" height="22" rx="4" fill="#2196F3" opacity="0.7"/>
    <text x="285" y="130" text-anchor="middle" font-size="10" fill="#fff" font-weight="500" font-family="system-ui,sans-serif">20→1</text>
    <rect x="370" y="115" width="70" height="22" rx="4" fill="#2196F3" opacity="0.7"/>
    <text x="405" y="130" text-anchor="middle" font-size="10" fill="#fff" font-weight="500" font-family="system-ui,sans-serif">20→1</text>
    <rect x="490" y="115" width="70" height="22" rx="4" fill="#2196F3" opacity="0.7"/>
    <text x="525" y="130" text-anchor="middle" font-size="10" fill="#fff" font-weight="500" font-family="system-ui,sans-serif">20→1</text>
  </g>
  <!-- Arrow L1 to L2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.27;0.97;1" dur="14s" repeatCount="indefinite"/>
    <line x1="360" y1="145" x2="360" y2="167" stroke="#E0E0E0" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="360" y="160" text-anchor="middle" font-size="9" fill="#9E9E9E" font-family="system-ui,sans-serif">Compaction</text>
  </g>
  <!-- Level 2: 1h aggregation -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.27;0.97;1" dur="14s" repeatCount="indefinite"/>
    <rect x="20" y="170" width="680" height="32" rx="4" fill="#E8EAF6"/>
    <text x="120" y="189" text-anchor="middle" font-size="12" font-weight="600" fill="#283593" font-family="system-ui,sans-serif">1-Hour Rollup (12×5m → avg)</text>
    <rect x="300" y="175" width="100" height="22" rx="4" fill="#5C6BC0" opacity="0.8"/>
    <text x="350" y="190" text-anchor="middle" font-size="10" fill="#fff" font-weight="500" font-family="system-ui,sans-serif">12→1</text>
    <rect x="460" y="175" width="100" height="22" rx="4" fill="#5C6BC0" opacity="0.8"/>
    <text x="510" y="190" text-anchor="middle" font-size="10" fill="#fff" font-weight="500" font-family="system-ui,sans-serif">12→1</text>
  </g>
  <!-- Arrow L2 to L3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.42;0.97;1" dur="14s" repeatCount="indefinite"/>
    <line x1="360" y1="205" x2="360" y2="227" stroke="#E0E0E0" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="360" y="220" text-anchor="middle" font-size="9" fill="#9E9E9E" font-family="system-ui,sans-serif">Compaction</text>
  </g>
  <!-- Level 3: 1d aggregation -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.42;0.97;1" dur="14s" repeatCount="indefinite"/>
    <rect x="20" y="230" width="680" height="32" rx="4" fill="#E8F5E9"/>
    <text x="120" y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#2E7D32" font-family="system-ui,sans-serif">1-Day Rollup (24×1h → avg)</text>
    <rect x="360" y="235" width="120" height="22" rx="4" fill="#4CAF50"/>
    <text x="420" y="250" text-anchor="middle" font-size="10" fill="#fff" font-weight="500" font-family="system-ui,sans-serif">24h→1</text>
  </g>
  <!-- Summary -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.57;0.97;1" dur="14s" repeatCount="indefinite"/>
    <line x1="20" y1="280" x2="700" y2="280" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="60" y="295" width="600" height="95" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
    <rect x="80" y="310" width="120" height="20" rx="3" fill="#FF9800"/>
    <text x="140" y="324" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">High Precision</text>
    <rect x="310" y="310" width="80" height="20" rx="3" fill="#5C6BC0"/>
    <text x="350" y="324" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">Trends</text>
    <rect x="500" y="310" width="120" height="20" rx="3" fill="#4CAF50"/>
    <text x="560" y="324" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">Archive</text>
    <text x="360" y="355" text-anchor="middle" font-size="13" fill="#333" font-family="system-ui,sans-serif">15s raw → 5-min rollup → 1-hour rollup → 1-day rollup</text>
    <text x="360" y="378" text-anchor="middle" font-size="14" fill="#7B1FA2" font-weight="600" font-family="system-ui,sans-serif">Storage density: from one point per 15s to one point per day — 5760x reduction</text>
  </g>
</svg>
{{- else -}}
