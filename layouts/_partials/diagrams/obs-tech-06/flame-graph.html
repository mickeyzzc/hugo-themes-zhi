{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="Flame graph construction animation">
  <rect width="720" height="250" fill="#fafafa" rx="8"/>
  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">Flame Graph Construction: Samples to Visualization</text>

  <!-- Phase 1: Raw Samples (fade in 0-0.5s, visible until 5.5s, crossfade out by 6.5s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.035;0.39;0.46;1" dur="14s" repeatCount="indefinite"/>
    <text x="360" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#FF9800" font-family="system-ui,sans-serif">Phase 1: Independent Stack Trace Samples</text>
    <rect x="60" y="55" width="120" height="14" rx="2" fill="#1565C0"/><text x="120" y="65" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">main</text>
    <rect x="60" y="71" width="120" height="14" rx="2" fill="#FF9800"/><text x="120" y="81" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">handleRequest</text>
    <rect x="60" y="87" width="120" height="14" rx="2" fill="#4CAF50"/><text x="120" y="97" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">dbQuery</text>
    <text x="120" y="115" text-anchor="middle" font-size="9" fill="#616161" font-family="system-ui,sans-serif">Sample A (50%)</text>
    <rect x="300" y="55" width="120" height="14" rx="2" fill="#1565C0"/><text x="360" y="65" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">main</text>
    <rect x="300" y="71" width="120" height="14" rx="2" fill="#FF9800"/><text x="360" y="81" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">handleRequest</text>
    <rect x="300" y="87" width="120" height="14" rx="2" fill="#9C27B0"/><text x="360" y="97" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">parseJSON</text>
    <text x="360" y="115" text-anchor="middle" font-size="9" fill="#616161" font-family="system-ui,sans-serif">Sample B (30%)</text>
    <rect x="540" y="55" width="120" height="14" rx="2" fill="#1565C0"/><text x="600" y="65" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">main</text>
    <rect x="540" y="71" width="120" height="14" rx="2" fill="#E65100"/><text x="600" y="81" text-anchor="middle" font-size="8" fill="#fff" font-family="monospace">validateToken</text>
    <text x="600" y="115" text-anchor="middle" font-size="9" fill="#616161" font-family="system-ui,sans-serif">Sample C (20%)</text>
    <text x="360" y="142" text-anchor="middle" font-size="10" fill="#9E9E9E" font-family="system-ui,sans-serif">↓ Merge identical paths, allocate widths by sample proportion ↓</text>
  </g>

  <!-- Phase 2: Flame Graph (crossfade in 5.5-6.5s, visible until 12.5s, fade out by 14s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.39;0.46;0.89;1" dur="14s" repeatCount="indefinite"/>
    <text x="360" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#9C27B0" font-family="system-ui,sans-serif">Phase 2: Aggregated Flame Graph</text>
    <rect x="100" y="55" width="180" height="22" rx="2" fill="#4CAF50"/><text x="190" y="70" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="monospace">dbQuery 50%</text>
    <rect x="280" y="55" width="108" height="22" rx="2" fill="#9C27B0"/><text x="334" y="70" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="monospace">parseJSON 30%</text>
    <rect x="100" y="79" width="288" height="22" rx="2" fill="#FF9800"/><text x="244" y="94" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="monospace">handleRequest 80%</text>
    <rect x="388" y="79" width="72" height="22" rx="2" fill="#E65100"/><text x="424" y="94" text-anchor="middle" font-size="9" fill="#fff" font-weight="600" font-family="monospace">validate 20%</text>
    <rect x="100" y="103" width="360" height="22" rx="2" fill="#1565C0"/><text x="280" y="118" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="monospace">main 100%</text>
    <text x="360" y="142" text-anchor="middle" font-size="10" fill="#9E9E9E" font-family="system-ui,sans-serif">Each frame's width = proportion of samples containing that function</text>
  </g>

  <!-- Insight callout (always visible) -->
  <rect x="40" y="165" width="640" height="65" rx="8" fill="#FFF8E1" stroke="#FF9800" stroke-width="1.5"/>
  <text x="360" y="190" text-anchor="middle" font-size="13" fill="#E65100" font-weight="700" font-family="system-ui,sans-serif">Widest flame = Hottest code path</text>
  <text x="360" y="212" text-anchor="middle" font-size="11" fill="#616161" font-family="system-ui,sans-serif">dbQuery at 50% samples = best optimization starting point</text>
</svg>
{{- else -}}

  <!-- Phase 2: Flame Graph (crossfade in 5.5-6.5s, visible until 12.5s, fade out by 14s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.39;0.46;0.89;1" dur="14s" repeatCount="indefinite"/>
    <text x="360" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#9C27B0" font-family="system-ui,sans-serif">阶段 2：聚合火焰图</text>
    <rect x="100" y="55" width="180" height="22" rx="2" fill="#4CAF50"/><text x="190" y="70" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="monospace">dbQuery 50%</text>
    <rect x="280" y="55" width="108" height="22" rx="2" fill="#9C27B0"/><text x="334" y="70" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="monospace">parseJSON 30%</text>

  </g>

  <!-- Insight callout (always visible) -->
