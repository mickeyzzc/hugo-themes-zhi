{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="Gorilla delta-of-delta encoding animation">
  <rect width="720" height="340" fill="#fafafa" rx="8"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">Gorilla Delta-of-Delta Encoding (15s fixed interval)</text>
  <rect x="20" y="44" width="680" height="28" rx="4" fill="#E3F2FD"/>
  <text x="80" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0" font-family="system-ui,sans-serif">Sample</text>
  <text x="220" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0" font-family="system-ui,sans-serif">Timestamp</text>
  <text x="360" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0" font-family="system-ui,sans-serif">Delta</text>
  <text x="500" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0" font-family="system-ui,sans-serif">Delta-of-Delta</text>
  <text x="640" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0" font-family="system-ui,sans-serif">Encoded Bits</text>
  <g opacity="0">
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.97;1" dur="14s" repeatCount="indefinite"/>
    <text x="80" y="92" text-anchor="middle" font-size="13" fill="#333" font-family="system-ui,sans-serif">t₁</text>
    <text x="220" y="92" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">100</text>
    <text x="360" y="92" text-anchor="middle" font-size="13" fill="#bbb" font-family="monospace">—</text>
    <text x="500" y="92" text-anchor="middle" font-size="13" fill="#bbb" font-family="monospace">—</text>
    <rect x="600" y="79" width="80" height="22" rx="4" fill="#FFF3E0" stroke="#FF9800"/>
    <text x="640" y="94" text-anchor="middle" font-size="12" fill="#E65100" font-weight="600" font-family="monospace">64 bits</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.17;0.18;0.97;1" dur="14s" repeatCount="indefinite"/>
    <text x="80" y="122" text-anchor="middle" font-size="13" fill="#333" font-family="system-ui,sans-serif">t₂</text>
    <text x="220" y="122" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">115</text>
    <text x="360" y="122" text-anchor="middle" font-size="13" fill="#1565C0" font-weight="600" font-family="monospace">15</text>
    <text x="500" y="122" text-anchor="middle" font-size="13" fill="#bbb" font-family="monospace">—</text>
    <rect x="600" y="109" width="80" height="22" rx="4" fill="#FFF3E0" stroke="#FF9800"/>
    <text x="640" y="124" text-anchor="middle" font-size="12" fill="#E65100" font-weight="600" font-family="monospace">14 bits</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.31;0.32;0.97;1" dur="14s" repeatCount="indefinite"/>
    <text x="80" y="152" text-anchor="middle" font-size="13" fill="#333" font-family="system-ui,sans-serif">t₃</text>
    <text x="220" y="152" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">130</text>
    <text x="360" y="152" text-anchor="middle" font-size="13" fill="#1565C0" font-weight="600" font-family="monospace">15</text>
    <text x="500" y="152" text-anchor="middle" font-size="13" fill="#7B1FA2" font-weight="700" font-family="monospace">0</text>
    <rect x="600" y="139" width="80" height="22" rx="4" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2">
      <animate attributeName="stroke-width" values="2;2;5;2;2" keyTimes="0;0.31;0.33;0.36;0.97" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="640" y="154" text-anchor="middle" font-size="14" fill="#2E7D32" font-weight="700" font-family="monospace">1 bit</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.46;0.97;1" dur="14s" repeatCount="indefinite"/>
    <text x="80" y="182" text-anchor="middle" font-size="13" fill="#333" font-family="system-ui,sans-serif">t₄</text>
    <text x="220" y="182" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">145</text>
    <text x="360" y="182" text-anchor="middle" font-size="13" fill="#1565C0" font-weight="600" font-family="monospace">15</text>
    <text x="500" y="182" text-anchor="middle" font-size="13" fill="#7B1FA2" font-weight="700" font-family="monospace">0</text>
    <rect x="600" y="169" width="80" height="22" rx="4" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/>
    <text x="640" y="184" text-anchor="middle" font-size="14" fill="#2E7D32" font-weight="700" font-family="monospace">1 bit</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.59;0.60;0.97;1" dur="14s" repeatCount="indefinite"/>
    <text x="80" y="212" text-anchor="middle" font-size="13" fill="#333" font-family="system-ui,sans-serif">t₅</text>
    <text x="220" y="212" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">160</text>
    <text x="360" y="212" text-anchor="middle" font-size="13" fill="#1565C0" font-weight="600" font-family="monospace">15</text>
    <text x="500" y="212" text-anchor="middle" font-size="13" fill="#7B1FA2" font-weight="700" font-family="monospace">0</text>
    <rect x="600" y="199" width="80" height="22" rx="4" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/>
    <text x="640" y="214" text-anchor="middle" font-size="14" fill="#2E7D32" font-weight="700" font-family="monospace">1 bit</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.75;0.97;1" dur="14s" repeatCount="indefinite"/>
    <line x1="20" y1="232" x2="700" y2="232" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="80" y="250" width="560" height="70" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="360" y="274" text-anchor="middle" font-size="13" fill="#616161" font-family="system-ui,sans-serif">Uncompressed: 5 × 64 = 320 bits</text>
    <text x="360" y="294" text-anchor="middle" font-size="14" fill="#2E7D32" font-weight="700" font-family="system-ui,sans-serif">Gorilla: 64 + 14 + 1 + 1 + 1 = 81 bits</text>
    <text x="360" y="312" text-anchor="middle" font-size="12" fill="#2E7D32" font-weight="600" font-family="system-ui,sans-serif">Longer fixed intervals → higher ratio, theoretical max 64x</text>
  </g>
</svg>
