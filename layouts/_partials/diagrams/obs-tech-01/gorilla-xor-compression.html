{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="Gorilla XOR float compression animation">
  <rect width="720" height="280" fill="#fafafa" rx="8"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">Gorilla XOR Float Compression (CPU Utilization Example)</text>
  <text x="60" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#666" font-family="system-ui,sans-serif">Samples</text>
  <text x="80" y="80" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">47.2%</text>
  <text x="80" y="108" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">47.3%</text>
  <text x="80" y="136" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">47.3%</text>
  <rect x="120" y="68" width="500" height="18" rx="3" fill="#2196F3" fill-opacity="0.3">
    <animate attributeName="fill-opacity" values="0.3;0.3;0.6;0.6;0.3" keyTimes="0;0.15;0.20;0.85;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="370" y="81" text-anchor="middle" font-size="10" fill="#1565C0" font-family="monospace">01000100... (64-bit float64)</text>
  <rect x="120" y="96" width="500" height="18" rx="3" fill="#2196F3" fill-opacity="0.3">
    <animate attributeName="fill-opacity" values="0.3;0.3;0.6;0.6;0.3" keyTimes="0;0.25;0.30;0.85;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="370" y="109" text-anchor="middle" font-size="10" fill="#1565C0" font-family="monospace">01000100... (only last bits differ)</text>
  <rect x="120" y="124" width="500" height="18" rx="3" fill="#2196F3" fill-opacity="0.3">
    <animate attributeName="fill-opacity" values="0.3;0.3;0.6;0.6;0.3" keyTimes="0;0.35;0.40;0.85;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="370" y="137" text-anchor="middle" font-size="10" fill="#1565C0" font-family="monospace">01000100... (identical)</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.50;0.85;1" dur="12s" repeatCount="indefinite"/>
    <text x="60" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#FF9800" font-family="system-ui,sans-serif">XOR Result</text>
    <text x="160" y="166" text-anchor="middle" font-size="12" fill="#7B1FA2" font-weight="600" font-family="monospace">51% → all zeros (1 bit)</text>
    <text x="160" y="184" text-anchor="middle" font-size="11" fill="#9E9E9E" font-family="monospace">when values match</text>
    <text x="460" y="166" text-anchor="middle" font-size="12" fill="#1565C0" font-weight="600" font-family="monospace">30% → similar (~27 bits)</text>
    <text x="460" y="184" text-anchor="middle" font-size="11" fill="#9E9E9E" font-family="monospace">last few bits differ</text>
    <text x="640" y="166" text-anchor="middle" font-size="12" fill="#E65100" font-weight="600" font-family="monospace">19% → different (~37 bits)</text>
    <text x="640" y="184" text-anchor="middle" font-size="11" fill="#9E9E9E" font-family="monospace">when value jumps</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.70;0.85;1" dur="12s" repeatCount="indefinite"/>
    <rect x="80" y="205" width="560" height="55" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="360" y="228" text-anchor="middle" font-size="13" fill="#333" font-family="system-ui,sans-serif">Weighted average: ~9.5 bits/value (uncompressed: 64 bits)</text>
    <text x="360" y="248" text-anchor="middle" font-size="14" fill="#2E7D32" font-weight="700" font-family="system-ui,sans-serif">Combined with timestamp compression → 1.37 bytes/point (12x ratio)</text>
  </g>
</svg>
{{- else -}}
<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="Gorilla XOR 浮点值压缩动画演示">
  <rect width="720" height="280" fill="#fafafa" rx="8"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">Gorilla XOR 浮点值压缩（CPU 利用率示例）</text>
  <text x="60" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#666" font-family="system-ui,sans-serif">采样值</text>
  <text x="80" y="80" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">47.2%</text>
  <text x="80" y="108" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">47.3%</text>
  <text x="80" y="136" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">47.3%</text>
  <rect x="120" y="68" width="500" height="18" rx="3" fill="#2196F3" fill-opacity="0.3">
    <animate attributeName="fill-opacity" values="0.3;0.3;0.6;0.6;0.3" keyTimes="0;0.15;0.20;0.85;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="370" y="81" text-anchor="middle" font-size="10" fill="#1565C0" font-family="monospace">01000100...（64 bit float64）</text>
  <rect x="120" y="96" width="500" height="18" rx="3" fill="#2196F3" fill-opacity="0.3">
    <animate attributeName="fill-opacity" values="0.3;0.3;0.6;0.6;0.3" keyTimes="0;0.25;0.30;0.85;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="370" y="109" text-anchor="middle" font-size="10" fill="#1565C0" font-family="monospace">01000100...（仅末位不同）</text>
  <rect x="120" y="124" width="500" height="18" rx="3" fill="#2196F3" fill-opacity="0.3">
    <animate attributeName="fill-opacity" values="0.3;0.3;0.6;0.6;0.3" keyTimes="0;0.35;0.40;0.85;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="370" y="137" text-anchor="middle" font-size="10" fill="#1565C0" font-family="monospace">01000100...（完全相同）</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.50;0.85;1" dur="12s" repeatCount="indefinite"/>
    <text x="60" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#FF9800" font-family="system-ui,sans-serif">XOR 结果</text>
    <text x="160" y="166" text-anchor="middle" font-size="12" fill="#7B1FA2" font-weight="600" font-family="monospace">51% → 全零（1 bit）</text>
    <text x="160" y="184" text-anchor="middle" font-size="11" fill="#9E9E9E" font-family="monospace">值完全相同时</text>
    <text x="460" y="166" text-anchor="middle" font-size="12" fill="#1565C0" font-weight="600" font-family="monospace">30% → 近似（~27 bits）</text>
    <text x="460" y="184" text-anchor="middle" font-size="11" fill="#9E9E9E" font-family="monospace">仅末几位不同</text>
    <text x="640" y="166" text-anchor="middle" font-size="12" fill="#E65100" font-weight="600" font-family="monospace">19% → 差异大（~37 bits）</text>
    <text x="640" y="184" text-anchor="middle" font-size="11" fill="#9E9E9E" font-family="monospace">值跳变时</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.70;0.85;1" dur="12s" repeatCount="indefinite"/>
    <rect x="80" y="205" width="560" height="55" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="360" y="228" text-anchor="middle" font-size="13" fill="#333" font-family="system-ui,sans-serif">加权平均：约 9.5 bits/值（未压缩 64 bits）</text>
    <text x="360" y="248" text-anchor="middle" font-size="14" fill="#2E7D32" font-weight="700" font-family="system-ui,sans-serif">配合时间戳压缩 → 每数据点仅 1.37 bytes（12x 压缩）</text>
  </g>
</svg>
{{- end -}}
