<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="GOP structure and seek cost animation">
<style>

  @keyframes arcB { 0%, 24% { stroke-dashoffset: 1; } 34%, 96% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
  @keyframes biIn { 0%, 34% { stroke-dashoffset: 1; } 42%, 96% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
  @keyframes seekDrop { 0%, 44% { opacity: 0; transform: translateY(-26px); } 50%, 94% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }
  @keyframes rewindDraw { 0%, 52% { stroke-dashoffset: 1; opacity: 0; } 56%, 94% { stroke-dashoffset: 0; opacity: 1; } 98%, 100% { opacity: 0; } }
  @keyframes rewindLabel { 0%, 55% { opacity: 0; } 60%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
  @keyframes idrPulse { 0%, 58% { transform: scale(0.6); opacity: 0; } 62% { transform: scale(1.15); opacity: 1; } 66%, 92% { transform: scale(1); opacity: 0.9; } 96%, 100% { opacity: 0; } }
  @keyframes badgeIn { 0%, 68% { opacity: 0; transform: scale(0.3); } 70%, 94% { opacity: 1; transform: scale(1); } 98%, 100% { opacity: 0; } }
  @keyframes noteIn { 0%, 86% { opacity: 0; } 90%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
  .arc-a { stroke-dasharray: 1; animation: arcA 15s infinite; }
  .arc-b { stroke-dasharray: 1; animation: arcB 15s infinite; }
  .bi-arc { stroke-dasharray: 1; animation: biIn 15s infinite; }
  .seek-grp { animation: seekDrop 15s infinite; }
  .rewind { stroke-dasharray: 1; animation: rewindDraw 15s infinite; }
  .rewind-label { animation: rewindLabel 15s infinite; }
  .idr-pulse { transform-box: fill-box; transform-origin: center; animation: idrPulse 15s infinite; }
  .badge { transform-box: fill-box; transform-origin: center; animation: badgeIn 15s infinite; }
  .note { animation: noteIn 15s infinite; }
</style>

  <text x="308" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#E65100" font-family="system-ui,sans-serif">P</text>
  <rect x="356" y="88" width="52" height="58" rx="5" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>

  <rect x="504" y="88" width="52" height="58" rx="5" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="530" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#E65100" font-family="system-ui,sans-serif">P</text>

  <text x="622" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#757575" font-family="system-ui,sans-serif">IDR</text>
  <text x="622" y="134" text-anchor="middle" font-size="8" fill="#9E9E9E" font-family="system-ui,sans-serif">new GOP</text>
  <text x="86" y="160" text-anchor="middle" font-size="9" fill="#9E9E9E" font-family="monospace">pts 0</text>
  <text x="160" y="160" text-anchor="middle" font-size="9" fill="#9E9E9E" font-family="monospace">pts 1</text>
  <text x="234" y="160" text-anchor="middle" font-size="9" fill="#9E9E9E" font-family="monospace">pts 2</text>

  <text x="456" y="160" text-anchor="middle" font-size="9" fill="#9E9E9E" font-family="monospace">pts 5</text>
  <text x="530" y="160" text-anchor="middle" font-size="9" fill="#9E9E9E" font-family="monospace">pts 6</text>

  <!-- GOP boundary -->

  <text x="572" y="54" font-size="9" fill="#757575" font-family="system-ui,sans-serif">GOP boundary (ClosedGOP: no cross-GOP refs)</text>

    <marker id="gopArrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2196F3"/>

    <marker id="gopArrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">

  <path class="bi-arc" pathLength="1" d="M 168 146 C 210 178, 268 178, 294 148" fill="none" stroke="#FF9800" stroke-width="1.4" marker-end="url(#gopArrowO)"/>
  <path class="bi-arc" pathLength="1" d="M 226 146 C 180 190, 116 190, 92 148" fill="none" stroke="#FF9800" stroke-width="1.4" marker-end="url(#gopArrowO)"/>
  <path class="bi-arc" pathLength="1" d="M 242 146 C 260 172, 282 172, 296 148" fill="none" stroke="#FF9800" stroke-width="1.4" marker-end="url(#gopArrowO)"/>
  <path class="bi-arc" pathLength="1" d="M 374 146 C 350 172, 328 172, 314 148" fill="none" stroke="#FF9800" stroke-width="1.4" marker-end="url(#gopArrowO)"/>
  <path class="bi-arc" pathLength="1" d="M 390 146 C 430 184, 496 184, 522 148" fill="none" stroke="#FF9800" stroke-width="1.4" marker-end="url(#gopArrowO)"/>

  <!-- seek marker -->
  <g class="seek-grp">
    <path d="M 374 70 l 8 12 h -16 z" fill="#D32F2F"/>
    <line x1="382" y1="82" x2="382" y2="88" stroke="#D32F2F" stroke-width="2"/>
    <text x="394" y="80" font-size="9.5" font-weight="700" fill="#D32F2F" font-family="system-ui,sans-serif">seek here?</text>
  </g>

  <!-- rewind arrow -->
  <path class="rewind" pathLength="1" d="M 382 66 C 320 8, 150 8, 92 62" fill="none" stroke="#D32F2F" stroke-width="1.8" stroke-dasharray="1" marker-end="url(#gopArrowR)"/>

  <rect class="idr-pulse" x="74" y="102" width="24" height="30" rx="4" fill="none" stroke="#D32F2F" stroke-width="2.5"/>

  <!-- decode-order badges -->
  <text x="34" y="80" font-size="9" fill="#9E9E9E" font-family="system-ui,sans-serif">decode order</text>
  <g class="badge"><circle cx="86" cy="76" r="9" fill="#37474F"/><text x="86" y="80" text-anchor="middle" font-size="10" fill="#fff" font-family="monospace">1</text></g>
  <g class="badge"><circle cx="308" cy="76" r="9" fill="#37474F"/><text x="308" y="80" text-anchor="middle" font-size="10" fill="#fff" font-family="monospace">2</text></g>
  <g class="badge"><circle cx="160" cy="76" r="9" fill="#37474F"/><text x="160" y="80" text-anchor="middle" font-size="10" fill="#fff" font-family="monospace">3</text></g>
  <g class="badge"><circle cx="234" cy="76" r="9" fill="#37474F"/><text x="234" y="80" text-anchor="middle" font-size="10" fill="#fff" font-family="monospace">4</text></g>
  <g class="badge"><circle cx="530" cy="76" r="9" fill="#37474F"/><text x="530" y="80" text-anchor="middle" font-size="10" fill="#fff" font-family="monospace">5</text></g>
  <g class="badge"><circle cx="382" cy="76" r="9" fill="#37474F"/><text x="382" y="80" text-anchor="middle" font-size="10" fill="#fff" font-family="monospace">6</text></g>
  <g class="badge"><circle cx="456" cy="76" r="9" fill="#37474F"/><text x="456" y="80" text-anchor="middle" font-size="10" fill="#fff" font-family="monospace">7</text></g>

  <!-- bottom note -->
  <g class="note">
    <rect x="80" y="248" width="560" height="76" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.2"/>
    <text x="360" y="274" text-anchor="middle" font-size="11" fill="#1565C0" font-family="system-ui,sans-serif">Longer GOP → fewer I-frames → higher compression; GOP length = frame distance between two IDRs</text>
    <text x="360" y="296" text-anchor="middle" font-size="11" fill="#C62828" font-family="system-ui,sans-serif">But seek and packet-loss recovery must fall back to the nearest IDR and re-decode forward</text>
    <text x="360" y="316" text-anchor="middle" font-size="9.5" fill="#546E7A" font-family="system-ui,sans-serif">live/lossy links → short GOP · VOD/distribution → long GOP (e.g. 250)</text>
  </g>
</svg>
