{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="Storage selection decision animation">
  <rect width="720" height="210" fill="#fafafa" rx="8"/>
  <text x="360" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">Scenario-Driven Storage Selection</text>

  <!-- Header bar (always visible) -->
  <rect x="20" y="35" width="680" height="24" rx="4" fill="#E3F2FD"/>
  <text x="90" y="51" text-anchor="middle" font-size="10" font-weight="600" fill="#1565C0" font-family="system-ui,sans-serif">Signal</text>
  <text x="270" y="51" text-anchor="middle" font-size="10" font-weight="600" fill="#1565C0" font-family="system-ui,sans-serif">Question</text>
  <text x="450" y="51" text-anchor="middle" font-size="10" font-weight="600" fill="#1565C0" font-family="system-ui,sans-serif">If Yes</text>
  <text x="610" y="51" text-anchor="middle" font-size="10" font-weight="600" fill="#1565C0" font-family="system-ui,sans-serif">If No</text>

  <!-- Phase A: Startup (fade in 0-0.3s, visible 0.3-4.0s, crossfade out 4.0-4.5s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.025;0.333;0.375;1" dur="12s" repeatCount="indefinite"/>
    <text x="360" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#4CAF50" font-family="system-ui,sans-serif">Scenario A: Startup — cost-sensitive, cloud-native</text>
    <rect x="30" y="80" width="120" height="24" rx="4" fill="#FF9800"/><text x="90" y="96" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">Metrics</text>
    <rect x="180" y="80" width="180" height="24" rx="4" fill="#E3F2FD" stroke="#2196F3"/><text x="270" y="96" text-anchor="middle" font-size="10" fill="#1565C0" font-family="system-ui,sans-serif">High cardinality?</text>
    <rect x="380" y="80" width="140" height="24" rx="4" fill="#C8E6C9" stroke="#4CAF50"/><text x="450" y="96" text-anchor="middle" font-size="10" fill="#2E7D32" font-family="system-ui,sans-serif">VictoriaMetrics</text>
    <rect x="540" y="80" width="140" height="24" rx="4" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/><text x="610" y="96" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="600" font-family="system-ui,sans-serif">Prometheus</text>
    <rect x="30" y="110" width="120" height="24" rx="4" fill="#FF9800"/><text x="90" y="126" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">Logs</text>
    <rect x="180" y="110" width="180" height="24" rx="4" fill="#E3F2FD" stroke="#2196F3"/><text x="270" y="126" text-anchor="middle" font-size="10" fill="#1565C0" font-family="system-ui,sans-serif">Budget constrained?</text>
    <rect x="380" y="110" width="140" height="24" rx="4" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/><text x="450" y="126" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="600" font-family="system-ui,sans-serif">Loki</text>
    <rect x="540" y="110" width="140" height="24" rx="4" fill="#C8E6C9" stroke="#4CAF50"/><text x="610" y="126" text-anchor="middle" font-size="10" fill="#2E7D32" font-family="system-ui,sans-serif">ES / ClickHouse</text>
    <text x="360" y="152" text-anchor="middle" font-size="10" fill="#4CAF50" font-family="system-ui,sans-serif">Startup stack: Prometheus + Loki — ~$3K/mo</text>
  </g>

  <!-- Phase B: Enterprise (crossfade in 4.0-4.5s, visible 4.5-8.0s, crossfade out 8.0-8.5s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.375;0.667;0.708;1" dur="12s" repeatCount="indefinite"/>
    <text x="360" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#FF9800" font-family="system-ui,sans-serif">Scenario B: Enterprise — compliance, full-text search, 1-3yr retention</text>
    <rect x="30" y="80" width="120" height="24" rx="4" fill="#FF9800"/><text x="90" y="96" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">Metrics</text>
    <rect x="180" y="80" width="180" height="24" rx="4" fill="#E3F2FD" stroke="#2196F3"/><text x="270" y="96" text-anchor="middle" font-size="10" fill="#1565C0" font-family="system-ui,sans-serif">High cardinality?</text>
    <rect x="380" y="80" width="140" height="24" rx="4" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/><text x="450" y="96" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="600" font-family="system-ui,sans-serif">VictoriaMetrics</text>
    <rect x="540" y="80" width="140" height="24" rx="4" fill="#C8E6C9" stroke="#4CAF50"/><text x="610" y="96" text-anchor="middle" font-size="10" fill="#2E7D32" font-family="system-ui,sans-serif">Prometheus</text>
    <rect x="30" y="110" width="120" height="24" rx="4" fill="#FF9800"/><text x="90" y="126" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">Logs</text>
    <rect x="180" y="110" width="180" height="24" rx="4" fill="#E3F2FD" stroke="#2196F3"/><text x="270" y="126" text-anchor="middle" font-size="10" fill="#1565C0" font-family="system-ui,sans-serif">Need full-text search?</text>
    <rect x="380" y="110" width="140" height="24" rx="4" fill="#C8E6C9" stroke="#4CAF50"/><text x="450" y="126" text-anchor="middle" font-size="10" fill="#2E7D32" font-family="system-ui,sans-serif">Loki</text>
    <rect x="540" y="110" width="140" height="24" rx="4" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/><text x="610" y="126" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="600" font-family="system-ui,sans-serif">ES / OpenSearch</text>
    <text x="610" y="152" text-anchor="middle" font-size="10" fill="#FF9800" font-family="system-ui,sans-serif">Enterprise stack: VM + ES — ~$15-30K/mo</text>
  </g>

  <!-- Phase C: Platform (crossfade in 8.0-8.5s, visible 8.5-11.5s, fade out 11.5-12s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.667;0.708;0.958;1" dur="12s" repeatCount="indefinite"/>
    <text x="360" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#9C27B0" font-family="system-ui,sans-serif">Scenario C: Platform Team — unified storage, cross-signal correlation</text>
    <rect x="30" y="80" width="120" height="24" rx="4" fill="#FF9800"/><text x="90" y="96" text-anchor="middle" font-size="10" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">All Signals</text>
    <rect x="180" y="80" width="180" height="24" rx="4" fill="#E3F2FD" stroke="#2196F3"/><text x="270" y="96" text-anchor="middle" font-size="10" fill="#1565C0" font-family="system-ui,sans-serif">Need SQL JOIN across signals?</text>
    <rect x="380" y="80" width="280" height="24" rx="4" fill="#E1BEE7" stroke="#9C27B0" stroke-width="2"/><text x="520" y="96" text-anchor="middle" font-size="11" fill="#4A148C" font-weight="700" font-family="system-ui,sans-serif">ClickHouse (unified columnar storage)</text>
    <text x="520" y="126" text-anchor="middle" font-size="10" fill="#9C27B0" font-family="system-ui,sans-serif">Platform stack: ClickHouse single engine — ~$8-15K/mo</text>
  </g>

  <!-- Insight callout (always visible) -->
  <rect x="40" y="165" width="640" height="35" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="360" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="600" font-family="system-ui,sans-serif">Key Insight: No "best" storage — only best fit for your context</text>
  <text x="360" y="194" text-anchor="middle" font-size="9" fill="#2E7D32" font-family="system-ui,sans-serif">Dimensions: data volume, query patterns, budget, team size, compliance requirements</text>
</svg>
{{- else -}}
