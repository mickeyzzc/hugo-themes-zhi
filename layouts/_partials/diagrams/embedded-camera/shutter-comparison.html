{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;" role="img" aria-label="Rolling vs Global Shutter">
<style>@media(prefers-reduced-motion:reduce){animate{display:none}}</style>
<text x="175" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#f57c00" font-family="sans-serif">Rolling Shutter</text>
<text x="175" y="30" text-anchor="middle" font-size="9" fill="#aaa">Scene: ball moves across</text>
<rect x="25" y="35" width="300" height="65" fill="#f5f5f5" stroke="#ddd"/>
<line x1="25" y1="51" x2="325" y2="51" stroke="#eee"/><line x1="25" y1="67" x2="325" y2="67" stroke="#eee"/><line x1="25" y1="84" x2="325" y2="84" stroke="#eee"/>
<rect x="25" y="35" width="300" height="16" fill="#ffa726" fill-opacity="0.3"><animate attributeName="y" values="35;83;83;35" keyTimes="0;0.45;0.8;1" dur="4s" repeatCount="indefinite"/></rect>
<circle cx="55" cy="67" r="12" fill="#42a5f5"><animate attributeName="cx" values="55;295;295;55" keyTimes="0;0.45;0.8;1" dur="4s" repeatCount="indefinite"/></circle>
<text x="175" y="115" text-anchor="middle" font-size="9" fill="#aaa">↓ Result (builds row-by-row)</text>
<rect x="25" y="122" width="300" height="65" fill="#fff" stroke="#ddd"/>
<line x1="25" y1="138" x2="325" y2="138" stroke="#eee"/><line x1="25" y1="155" x2="325" y2="155" stroke="#eee"/><line x1="25" y1="171" x2="325" y2="171" stroke="#eee"/>
<g opacity="0"><rect x="43" y="124" width="24" height="14" rx="3" fill="#42a5f5"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.8;1" dur="4s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="123" y="140" width="24" height="14" rx="3" fill="#42a5f5"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.15;0.8;1" dur="4s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="203" y="157" width="24" height="14" rx="3" fill="#42a5f5"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.29;0.30;0.8;1" dur="4s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="283" y="173" width="24" height="14" rx="3" fill="#42a5f5"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.45;0.8;1" dur="4s" repeatCount="indefinite"/></g>
<text x="175" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#e53935" font-family="sans-serif">⚠ Jello effect: diagonal skew</text>
<text x="535" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#388e3c" font-family="sans-serif">Global Shutter</text>
<text x="535" y="30" text-anchor="middle" font-size="9" fill="#aaa">Scene: same ball moves across</text>
<rect x="385" y="35" width="300" height="65" fill="#f5f5f5" stroke="#ddd"/>
<line x1="385" y1="51" x2="685" y2="51" stroke="#eee"/><line x1="385" y1="67" x2="685" y2="67" stroke="#eee"/><line x1="385" y1="84" x2="685" y2="84" stroke="#eee"/>
<rect x="385" y="35" width="300" height="65" fill="#66bb6a" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;0.4;0;0" keyTimes="0;0.21;0.22;0.25;1" dur="4s" repeatCount="indefinite"/></rect>
<circle cx="415" cy="67" r="12" fill="#42a5f5"><animate attributeName="cx" values="415;655;655;415" keyTimes="0;0.45;0.8;1" dur="4s" repeatCount="indefinite"/></circle>
<text x="535" y="115" text-anchor="middle" font-size="9" fill="#aaa">↓ Result (instantaneous)</text>
<rect x="385" y="122" width="300" height="65" fill="#fff" stroke="#ddd"/>
<line x1="385" y1="138" x2="685" y2="138" stroke="#eee"/><line x1="385" y1="155" x2="685" y2="155" stroke="#eee"/><line x1="385" y1="171" x2="685" y2="171" stroke="#eee"/>
<g opacity="0"><rect x="463" y="124" width="24" height="14" rx="3" fill="#42a5f5"/><rect x="463" y="140" width="24" height="14" rx="3" fill="#42a5f5"/><rect x="463" y="157" width="24" height="14" rx="3" fill="#42a5f5"/><rect x="463" y="173" width="24" height="14" rx="3" fill="#42a5f5"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.21;0.22;0.8;1" dur="4s" repeatCount="indefinite"/></g>
<text x="535" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#388e3c" font-family="sans-serif">✓ No distortion: clean vertical bar</text>
</svg>
{{- else -}}
<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;" role="img" aria-label="滚动快门 vs 全局快门">
<style>@media(prefers-reduced-motion:reduce){animate{display:none}}</style>
<!-- ====== 左: 滚动快门 ====== -->
<text x="175" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#f57c00" font-family="sans-serif">滚动快门 Rolling Shutter</text>
<!-- 场景 -->
<text x="175" y="30" text-anchor="middle" font-size="9" fill="#aaa">场景：球体横穿画面</text>
<rect x="25" y="35" width="300" height="65" fill="#f5f5f5" stroke="#ddd"/>
<line x1="25" y1="51" x2="325" y2="51" stroke="#eee"/><line x1="25" y1="67" x2="325" y2="67" stroke="#eee"/><line x1="25" y1="84" x2="325" y2="84" stroke="#eee"/>
<!-- 扫描线 -->
<rect x="25" y="35" width="300" height="16" fill="#ffa726" fill-opacity="0.3"><animate attributeName="y" values="35;83;83;35" keyTimes="0;0.45;0.8;1" dur="4s" repeatCount="indefinite"/></rect>
<!-- 球 -->
<circle cx="55" cy="67" r="12" fill="#42a5f5"><animate attributeName="cx" values="55;295;295;55" keyTimes="0;0.45;0.8;1" dur="4s" repeatCount="indefinite"/></circle>
<text x="175" y="115" text-anchor="middle" font-size="9" fill="#aaa">↓ 拍摄结果（逐行构建）</text>
<!-- 拍摄结果: 4行逐行出现，球的位置不同→对角线 -->
<rect x="25" y="122" width="300" height="65" fill="#fff" stroke="#ddd"/>
<line x1="25" y1="138" x2="325" y2="138" stroke="#eee"/><line x1="25" y1="155" x2="325" y2="155" stroke="#eee"/><line x1="25" y1="171" x2="325" y2="171" stroke="#eee"/>
<g opacity="0"><rect x="43" y="124" width="24" height="14" rx="3" fill="#42a5f5"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.8;1" dur="4s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="123" y="140" width="24" height="14" rx="3" fill="#42a5f5"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.15;0.8;1" dur="4s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="203" y="157" width="24" height="14" rx="3" fill="#42a5f5"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.29;0.30;0.8;1" dur="4s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="283" y="173" width="24" height="14" rx="3" fill="#42a5f5"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.45;0.8;1" dur="4s" repeatCount="indefinite"/></g>
<text x="175" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#e53935" font-family="sans-serif">⚠ 果冻效应：球体倾斜畸变</text>
<!-- ====== 右: 全局快门 ====== -->
<text x="535" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#388e3c" font-family="sans-serif">全局快门 Global Shutter</text>
<text x="535" y="30" text-anchor="middle" font-size="9" fill="#aaa">场景：同一球体横穿画面</text>
<rect x="385" y="35" width="300" height="65" fill="#f5f5f5" stroke="#ddd"/>
<line x1="385" y1="51" x2="685" y2="51" stroke="#eee"/><line x1="385" y1="67" x2="685" y2="67" stroke="#eee"/><line x1="385" y1="84" x2="685" y2="84" stroke="#eee"/>
<!-- 全局闪光 -->
<rect x="385" y="35" width="300" height="65" fill="#66bb6a" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;0.4;0;0" keyTimes="0;0.21;0.22;0.25;1" dur="4s" repeatCount="indefinite"/></rect>
<circle cx="415" cy="67" r="12" fill="#42a5f5"><animate attributeName="cx" values="415;655;655;415" keyTimes="0;0.45;0.8;1" dur="4s" repeatCount="indefinite"/></circle>
<text x="535" y="115" text-anchor="middle" font-size="9" fill="#aaa">↓ 拍摄结果（同时完成）</text>
<rect x="385" y="122" width="300" height="65" fill="#fff" stroke="#ddd"/>
<line x1="385" y1="138" x2="685" y2="138" stroke="#eee"/><line x1="385" y1="155" x2="685" y2="155" stroke="#eee"/><line x1="385" y1="171" x2="685" y2="171" stroke="#eee"/>
<!-- 所有行同时出现，球在同一位置→竖条 -->
<g opacity="0"><rect x="463" y="124" width="24" height="14" rx="3" fill="#42a5f5"/><rect x="463" y="140" width="24" height="14" rx="3" fill="#42a5f5"/><rect x="463" y="157" width="24" height="14" rx="3" fill="#42a5f5"/><rect x="463" y="173" width="24" height="14" rx="3" fill="#42a5f5"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.21;0.22;0.8;1" dur="4s" repeatCount="indefinite"/></g>
<text x="535" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#388e3c" font-family="sans-serif">✓ 无畸变：球体完整竖条</text>
</svg>
{{- end -}}
