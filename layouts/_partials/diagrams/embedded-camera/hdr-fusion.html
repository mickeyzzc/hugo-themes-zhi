{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 170" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;" role="img" aria-label="HDR multi-exposure fusion">
<style>@media(prefers-reduced-motion:reduce){animate{display:none}}</style>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" dur="5s" repeatCount="indefinite"/>
<rect x="30" y="25" width="160" height="100" fill="#263238" rx="4"/>
<rect x="50" y="40" width="120" height="25" fill="#fff9c4" opacity="0.9"/>
<text x="110" y="57" text-anchor="middle" font-size="9" fill="#5d4037" font-family="sans-serif">Sky ✓</text>
<rect x="50" y="75" width="120" height="35" fill="#1a1a1a"/>
<text x="110" y="95" text-anchor="middle" font-size="9" fill="#666" font-family="sans-serif">Shadow ✗</text>
<text x="110" y="145" text-anchor="middle" font-size="11" fill="#888" font-family="sans-serif">Short Exposure</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.25;0.8;1" dur="5s" repeatCount="indefinite"/>
<rect x="230" y="25" width="160" height="100" fill="#fff3e0" rx="4"/>
<rect x="250" y="40" width="120" height="25" fill="#ffffff"/>
<text x="310" y="57" text-anchor="middle" font-size="9" fill="#bbb" font-family="sans-serif">Sky ✗</text>
<rect x="250" y="75" width="120" height="35" fill="#8d6e63"/>
<text x="310" y="95" text-anchor="middle" font-size="9" fill="#fff" font-family="sans-serif">Shadow ✓</text>
<text x="310" y="145" text-anchor="middle" font-size="11" fill="#888" font-family="sans-serif">Long Exposure</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.8;1" dur="5s" repeatCount="indefinite"/>
<text x="415" y="82" font-size="22" font-family="sans-serif" fill="#aaa">+</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.8;1" dur="5s" repeatCount="indefinite"/>
<rect x="470" y="25" width="200" height="100" fill="#eceff1" rx="4"/>
<rect x="490" y="40" width="160" height="25" fill="#fff9c4" opacity="0.8"/>
<text x="570" y="57" text-anchor="middle" font-size="9" fill="#5d4037" font-family="sans-serif">Sky ✓</text>
<rect x="490" y="75" width="160" height="35" fill="#8d6e63"/>
<text x="570" y="95" text-anchor="middle" font-size="9" fill="#fff" font-family="sans-serif">Shadow ✓</text>
<text x="570" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#4caf50" font-family="sans-serif">HDR Result ✓</text>
</g>
</svg>
{{- else -}}
<svg viewBox="0 0 720 170" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;" role="img" aria-label="HDR 多重曝光合成">
<style>@media(prefers-reduced-motion:reduce){animate{display:none}}</style>
<!-- 短曝光: 逐步显现 -->
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" dur="5s" repeatCount="indefinite"/>
<rect x="30" y="25" width="160" height="100" fill="#263238" rx="4"/>
<rect x="50" y="40" width="120" height="25" fill="#fff9c4" opacity="0.9"/>
<text x="110" y="57" text-anchor="middle" font-size="9" fill="#5d4037" font-family="sans-serif">天空 ✓</text>
<rect x="50" y="75" width="120" height="35" fill="#1a1a1a"/>
<text x="110" y="95" text-anchor="middle" font-size="9" fill="#666" font-family="sans-serif">暗部 ✗</text>
<text x="110" y="145" text-anchor="middle" font-size="11" fill="#888" font-family="sans-serif">短曝光 Short</text>
</g>
<!-- 长曝光: 延迟显现 -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.25;0.8;1" dur="5s" repeatCount="indefinite"/>
<rect x="230" y="25" width="160" height="100" fill="#fff3e0" rx="4"/>
<rect x="250" y="40" width="120" height="25" fill="#ffffff"/>
<text x="310" y="57" text-anchor="middle" font-size="9" fill="#bbb" font-family="sans-serif">天空 ✗</text>
<rect x="250" y="75" width="120" height="35" fill="#8d6e63"/>
<text x="310" y="95" text-anchor="middle" font-size="9" fill="#fff" font-family="sans-serif">暗部 ✓</text>
<text x="310" y="145" text-anchor="middle" font-size="11" fill="#888" font-family="sans-serif">长曝光 Long</text>
</g>
<!-- 合并动画箭头 -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.8;1" dur="5s" repeatCount="indefinite"/>
<text x="415" y="82" font-size="22" font-family="sans-serif" fill="#aaa">+</text>
</g>
<!-- HDR 结果: 最后显现 -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.8;1" dur="5s" repeatCount="indefinite"/>
<rect x="470" y="25" width="200" height="100" fill="#eceff1" rx="4"/>
<rect x="490" y="40" width="160" height="25" fill="#fff9c4" opacity="0.8"/>
<text x="570" y="57" text-anchor="middle" font-size="9" fill="#5d4037" font-family="sans-serif">天空 ✓</text>
<rect x="490" y="75" width="160" height="35" fill="#8d6e63"/>
<text x="570" y="95" text-anchor="middle" font-size="9" fill="#fff" font-family="sans-serif">暗部 ✓</text>
<text x="570" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#4caf50" font-family="sans-serif">HDR 合成 ✓</text>
</g>
</svg>
{{- end -}}
