{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;" role="img" aria-label="BSI vs FSI cross-section">
<style>@media(prefers-reduced-motion:reduce){animate{display:none}}</style>
<text x="165" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#f57c00" font-family="sans-serif">FSI (Frontside)</text>
<rect x="55" y="55" width="220" height="22" fill="#c8e6c9" stroke="#81c784"/><text x="165" y="70" text-anchor="middle" font-size="9" fill="#2e7d32" font-family="sans-serif">Color Filter</text>
<rect x="55" y="82" width="220" height="22" fill="#ffcdd2" stroke="#ef9a9a"/><text x="165" y="97" text-anchor="middle" font-size="9" fill="#c62828" font-family="sans-serif">✗ Wiring Blocks Light</text>
<rect x="55" y="109" width="220" height="30" fill="#bbdefb" stroke="#90caf9"/><text x="165" y="127" text-anchor="middle" font-size="9" fill="#1565c0" font-family="sans-serif">Photodiode</text>
<g fill="#ffc107">
<circle cx="90" cy="35" r="6"><animate attributeName="cy" values="35;78;35" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" dur="2s" keyTimes="0;0.38;0.42;1" repeatCount="indefinite"/></circle>
<circle cx="145" cy="35" r="6"><animate attributeName="cy" values="35;132;35" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle cx="200" cy="35" r="6"><animate attributeName="cy" values="35;78;35" dur="2s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" dur="2s" begin="0.7s" keyTimes="0;0.38;0.42;1" repeatCount="indefinite"/></circle>
<circle cx="245" cy="35" r="6"><animate attributeName="cy" values="35;132;35" dur="2.5s" begin="1s" repeatCount="indefinite"/></circle>
</g>
<text x="165" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#e53935" font-family="sans-serif">≈50% photons blocked by wiring</text>
<text x="555" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#388e3c" font-family="sans-serif">BSI (Backside)</text>
<rect x="445" y="55" width="220" height="22" fill="#c8e6c9" stroke="#81c784"/><text x="555" y="70" text-anchor="middle" font-size="9" fill="#2e7d32" font-family="sans-serif">Color Filter</text>
<rect x="445" y="82" width="220" height="30" fill="#bbdefb" stroke="#90caf9"/><text x="555" y="100" text-anchor="middle" font-size="9" fill="#1565c0" font-family="sans-serif">✓ Photodiode Direct Entry</text>
<rect x="445" y="117" width="220" height="22" fill="#ffcdd2" stroke="#ef9a9a"/><text x="555" y="132" text-anchor="middle" font-size="9" fill="#c62828" font-family="sans-serif">Wiring (below, no blockage)</text>
<g fill="#ffc107">
<circle cx="480" cy="35" r="6"><animate attributeName="cy" values="35;107;35" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="535" cy="35" r="6"><animate attributeName="cy" values="35;107;35" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle cx="590" cy="35" r="6"><animate attributeName="cy" values="35;107;35" dur="2s" begin="0.7s" repeatCount="indefinite"/></circle>
<circle cx="635" cy="35" r="6"><animate attributeName="cy" values="35;107;35" dur="2.5s" begin="1s" repeatCount="indefinite"/></circle>
</g>
<text x="555" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#388e3c" font-family="sans-serif">≈100% photons absorbed</text>
</svg>
{{- else -}}
<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;" role="img" aria-label="BSI vs FSI 截面对比">
<style>@media(prefers-reduced-motion:reduce){animate{display:none}}</style>
<!-- 左: FSI -->
<text x="165" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#f57c00" font-family="sans-serif">前照式 FSI</text>
<rect x="55" y="55" width="220" height="22" fill="#c8e6c9" stroke="#81c784"/><text x="165" y="70" text-anchor="middle" font-size="9" fill="#2e7d32" font-family="sans-serif">滤色镜 Color Filter</text>
<rect x="55" y="82" width="220" height="22" fill="#ffcdd2" stroke="#ef9a9a"/><text x="165" y="97" text-anchor="middle" font-size="9" fill="#c62828" font-family="sans-serif">✗ 金属走线 Wiring</text>
<rect x="55" y="109" width="220" height="30" fill="#bbdefb" stroke="#90caf9"/><text x="165" y="127" text-anchor="middle" font-size="9" fill="#1565c0" font-family="sans-serif">光电二极管 Photodiode</text>
<g fill="#ffc107">
<circle cx="90" cy="35" r="6"><animate attributeName="cy" values="35;78;35" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" dur="2s" keyTimes="0;0.38;0.42;1" repeatCount="indefinite"/></circle>
<circle cx="145" cy="35" r="6"><animate attributeName="cy" values="35;132;35" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle cx="200" cy="35" r="6"><animate attributeName="cy" values="35;78;35" dur="2s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" dur="2s" begin="0.7s" keyTimes="0;0.38;0.42;1" repeatCount="indefinite"/></circle>
<circle cx="245" cy="35" r="6"><animate attributeName="cy" values="35;132;35" dur="2.5s" begin="1s" repeatCount="indefinite"/></circle>
</g>
<text x="165" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#e53935" font-family="sans-serif">≈50% 光子被走线遮挡</text>
<!-- 右: BSI -->
<text x="555" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#388e3c" font-family="sans-serif">背照式 BSI</text>
<rect x="445" y="55" width="220" height="22" fill="#c8e6c9" stroke="#81c784"/><text x="555" y="70" text-anchor="middle" font-size="9" fill="#2e7d32" font-family="sans-serif">滤色镜 Color Filter</text>
<rect x="445" y="82" width="220" height="30" fill="#bbdefb" stroke="#90caf9"/><text x="555" y="100" text-anchor="middle" font-size="9" fill="#1565c0" font-family="sans-serif">✓ 光电二极管 Photodiode</text>
<rect x="445" y="117" width="220" height="22" fill="#ffcdd2" stroke="#ef9a9a"/><text x="555" y="132" text-anchor="middle" font-size="9" fill="#c62828" font-family="sans-serif">金属走线 (在下方不挡光)</text>
<g fill="#ffc107">
<circle cx="480" cy="35" r="6"><animate attributeName="cy" values="35;107;35" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="535" cy="35" r="6"><animate attributeName="cy" values="35;107;35" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle cx="590" cy="35" r="6"><animate attributeName="cy" values="35;107;35" dur="2s" begin="0.7s" repeatCount="indefinite"/></circle>
<circle cx="635" cy="35" r="6"><animate attributeName="cy" values="35;107;35" dur="2.5s" begin="1s" repeatCount="indefinite"/></circle>
</g>
<text x="555" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#388e3c" font-family="sans-serif">≈100% 光子全被吸收</text>
</svg>
{{- end -}}
