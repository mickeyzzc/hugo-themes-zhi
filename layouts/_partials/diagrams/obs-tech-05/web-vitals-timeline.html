{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="Web Vitals Page Load Timeline">
  <rect width="720" height="300" fill="#fafafa" rx="8"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">Web Vitals Page Load Timeline</text>
  <line x1="60" y1="150" x2="680" y2="150" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="150" r="7" fill="#9C27B0"/>
  <text x="60" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#9C27B0" font-family="system-ui,sans-serif">Page Load</text>
  <text x="60" y="175" text-anchor="middle" font-size="10" fill="#9E9E9E" font-family="monospace">t=0</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.12;0.90;1" dur="14s" repeatCount="indefinite"/>
    <circle cx="195" cy="150" r="7" fill="#2196F3"/>
    <rect x="145" y="185" width="100" height="52" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
    <text x="195" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0" font-family="monospace">FCP</text>
    <text x="195" y="223" text-anchor="middle" font-size="10" fill="#1565C0" font-family="system-ui,sans-serif">First Contentful Paint</text>
    <text x="195" y="175" text-anchor="middle" font-size="10" fill="#9E9E9E" font-family="monospace">~1.2s</text>
    <circle cx="195" cy="150" r="12" fill="none" stroke="#2196F3" stroke-width="2">
      <animate attributeName="r" values="7;14;7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.27;0.90;1" dur="14s" repeatCount="indefinite"/>
    <circle cx="350" cy="150" r="7" fill="#FF9800"/>
    <rect x="300" y="185" width="100" height="52" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
    <text x="350" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100" font-family="monospace">LCP</text>
    <text x="350" y="223" text-anchor="middle" font-size="10" fill="#E65100" font-family="system-ui,sans-serif">Largest Contentful Paint</text>
    <text x="350" y="175" text-anchor="middle" font-size="10" fill="#9E9E9E" font-family="monospace">~2.5s</text>
    <circle cx="350" cy="150" r="12" fill="none" stroke="#FF9800" stroke-width="2">
      <animate attributeName="r" values="7;14;7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.41;0.90;1" dur="14s" repeatCount="indefinite"/>
    <circle cx="430" cy="150" r="7" fill="#f44336"/>
    <rect x="378" y="83" width="104" height="52" rx="6" fill="#FFEBEE" stroke="#f44336" stroke-width="1.5"/>
    <text x="430" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#C62828" font-family="monospace">CLS</text>
    <text x="430" y="121" text-anchor="middle" font-size="10" fill="#C62828" font-family="system-ui,sans-serif">Cumulative Layout Shift</text>
    <text x="430" y="175" text-anchor="middle" font-size="10" fill="#9E9E9E" font-family="monospace">~3.0s</text>
    <circle cx="430" cy="150" r="12" fill="none" stroke="#f44336" stroke-width="2">
      <animate attributeName="r" values="7;14;7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.55;0.90;1" dur="14s" repeatCount="indefinite"/>
    <circle cx="540" cy="150" r="7" fill="#9C27B0"/>
    <rect x="488" y="185" width="104" height="52" rx="6" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
    <text x="540" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#6A1B9A" font-family="monospace">INP</text>
    <text x="540" y="223" text-anchor="middle" font-size="10" fill="#6A1B9A" font-family="system-ui,sans-serif">Interaction to Next Paint</text>
    <text x="540" y="175" text-anchor="middle" font-size="10" fill="#9E9E9E" font-family="monospace">~4.2s</text>
    <circle cx="540" cy="150" r="12" fill="none" stroke="#9C27B0" stroke-width="2">
      <animate attributeName="r" values="7;14;7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.70;0.90;1" dur="14s" repeatCount="indefinite"/>
    <rect x="120" y="248" width="480" height="38" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="360" y="268" text-anchor="middle" font-size="11" fill="#333" font-family="system-ui,sans-serif">FCP → LCP → CLS → INP: four metrics covering the full user experience</text>
    <text x="360" y="280" text-anchor="middle" font-size="10" fill="#2E7D32" font-family="system-ui,sans-serif">LCP and CLS together account for 50% of page load experience weight</text>
  </g>
</svg>
{{- else -}}
