{{- /* H.264 Annex-B byte stream: start codes split NALUs; cursor sweeps and types light up. */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="H.264 NALU byte stream parse animation">
<style>
  @keyframes cur1 {
    0%, 7% { opacity: 0; transform: translate(0px, 0px); }
    9% { opacity: 0.85; transform: translate(0px, 0px); }
    40% { opacity: 0.85; transform: translate(580px, 0px); }
    43%, 100% { opacity: 0; transform: translate(580px, 0px); }
  }
  @keyframes cur2 {
    0%, 45% { opacity: 0; transform: translate(0px, 0px); }
    47% { opacity: 0.85; transform: translate(0px, 0px); }
    78% { opacity: 0.85; transform: translate(560px, 0px); }
    81%, 100% { opacity: 0; transform: translate(560px, 0px); }
  }
  @keyframes g1on { 0%, 9% { opacity: 0.35; } 13%, 19% { opacity: 1; } 24%, 100% { opacity: 0.35; } }
  @keyframes g2on { 0%, 24% { opacity: 0.35; } 28%, 38% { opacity: 1; } 43%, 100% { opacity: 0.35; } }
  @keyframes g3on { 0%, 47% { opacity: 0.35; } 51%, 61% { opacity: 1; } 66%, 100% { opacity: 0.35; } }
  @keyframes g4on { 0%, 66% { opacity: 0.35; } 70%, 77% { opacity: 1; } 82%, 100% { opacity: 0.35; } }
  @keyframes chip1 { 0%, 10% { opacity: 0; } 13%, 19% { opacity: 1; } 23%, 100% { opacity: 0; } }
  @keyframes chip2 { 0%, 25% { opacity: 0; } 28%, 37% { opacity: 1; } 41%, 100% { opacity: 0; } }
  @keyframes chip3 { 0%, 48% { opacity: 0; } 51%, 61% { opacity: 1; } 65%, 100% { opacity: 0; } }
  @keyframes chip4 { 0%, 67% { opacity: 0; } 70%, 77% { opacity: 1; } 81%, 100% { opacity: 0; } }
  .cur-1 { animation: cur1 13s infinite; }
  .cur-2 { animation: cur2 13s infinite; }
  .g-1 { animation: g1on 13s infinite; }
  .g-2 { animation: g2on 13s infinite; }
  .g-3 { animation: g3on 13s infinite; }
  .g-4 { animation: g4on 13s infinite; }
  .chip-1 { animation: chip1 13s infinite; }
  .chip-2 { animation: chip2 13s infinite; }
  .chip-3 { animation: chip3 13s infinite; }
  .chip-4 { animation: chip4 13s infinite; }
</style>
  <rect width="720" height="380" fill="#fafafa" rx="8"/>
  <text x="360" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">Raw H.264 stream: start codes slice it into NALUs</text>

  <!-- legend -->
  <text x="460" y="44" font-size="9" fill="#9E9E9E" font-family="system-ui,sans-serif">■ start code</text>
  <rect x="516" y="36" width="8" height="8" fill="#EF9A9A"/>
  <text x="532" y="44" font-size="9" fill="#9E9E9E" font-family="system-ui,sans-serif">■ NALU header</text>
  <rect x="604" y="36" width="8" height="8" fill="#90CAF9"/>
  <text x="620" y="44" font-size="9" fill="#9E9E9E" font-family="system-ui,sans-serif">■ payload</text>
  <rect x="682" y="36" width="8" height="8" fill="#CFD8DC"/>

  <!-- row 1 bytes -->
  <text x="50" y="70" font-size="14" font-family="monospace" fill="#C62828" font-weight="700">00 00 00 01</text>
  <text x="151" y="70" font-size="14" font-family="monospace" fill="#1565C0" font-weight="700">67</text>
  <text x="168" y="70" font-size="14" font-family="monospace" fill="#90A4AE">64 00 1e …</text>
  <text x="430" y="70" font-size="14" font-family="monospace" fill="#C62828" font-weight="700">00 00 00 01</text>
  <text x="531" y="70" font-size="14" font-family="monospace" fill="#1565C0" font-weight="700">68</text>
  <text x="548" y="70" font-size="14" font-family="monospace" fill="#90A4AE">eb e3 …</text>

  <!-- row 1 brackets + labels -->
  <g class="g-1">
    <path d="M 50 78 v 6 h 210 v -6" fill="none" stroke="#2196F3" stroke-width="1.6"/>
    <text x="155" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#1565C0" font-family="system-ui,sans-serif">NALU #1 · SPS (Type 7)</text>
    <text x="155" y="115" text-anchor="middle" font-size="8.5" fill="#546E7A" font-family="monospace">67 = 0110 0111b → F:0 NRI:3 Type:7</text>
  </g>
  <g class="g-2">
    <path d="M 430 78 v 6 h 185 v -6" fill="none" stroke="#9C27B0" stroke-width="1.6"/>
    <text x="522" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#6A1B9A" font-family="system-ui,sans-serif">NALU #2 · PPS (Type 8)</text>
    <text x="522" y="115" text-anchor="middle" font-size="8.5" fill="#546E7A" font-family="monospace">68 = 0110 1000b → Type:8</text>
  </g>

  <!-- row 2 bytes -->
  <text x="50" y="162" font-size="14" font-family="monospace" fill="#C62828" font-weight="700">00 00 00 01</text>
  <text x="151" y="162" font-size="14" font-family="monospace" fill="#1565C0" font-weight="700">65</text>
  <text x="168" y="162" font-size="14" font-family="monospace" fill="#90A4AE">b8 40 …</text>
  <text x="430" y="162" font-size="14" font-family="monospace" fill="#C62828" font-weight="700">00 00 01</text>
  <text x="506" y="162" font-size="14" font-family="monospace" fill="#1565C0" font-weight="700">41</text>
  <text x="523" y="162" font-size="14" font-family="monospace" fill="#90A4AE">9a 2c …</text>

  <!-- row 2 brackets + labels -->
  <g class="g-3">
    <path d="M 50 170 v 6 h 210 v -6" fill="none" stroke="#F44336" stroke-width="1.6"/>
    <text x="155" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#C62828" font-family="system-ui,sans-serif">NALU #3 · IDR slice (Type 5) — keyframe</text>
    <text x="155" y="207" text-anchor="middle" font-size="8.5" fill="#546E7A" font-family="monospace">65 = 0110 0101b → Type:5</text>
  </g>
  <g class="g-4">
    <path d="M 430 170 v 6 h 170 v -6" fill="none" stroke="#FF9800" stroke-width="1.6"/>
    <text x="515" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#E65100" font-family="system-ui,sans-serif">NALU #4 · non-IDR slice (Type 1) — P</text>
    <text x="515" y="207" text-anchor="middle" font-size="8.5" fill="#546E7A" font-family="monospace">41 = 0100 0001b → Type:1</text>
  </g>

  <!-- cursors -->
  <rect class="cur-1" x="42" y="54" width="12" height="24" rx="2" fill="#FFD54F" fill-opacity="0.9"/>
  <rect class="cur-2" x="42" y="146" width="12" height="24" rx="2" fill="#FFD54F" fill-opacity="0.9"/>

  <!-- status chips -->
  <g class="chip-1">
    <rect x="150" y="248" width="420" height="40" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
    <text x="360" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#1565C0" font-family="system-ui,sans-serif">parsing SPS → resolution, profile, level (sequence-wide)</text>
  </g>
  <g class="chip-2">
    <rect x="150" y="248" width="420" height="40" rx="6" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
    <text x="360" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#6A1B9A" font-family="system-ui,sans-serif">parsing PPS → entropy coder, initial QP (per-picture)</text>
  </g>
  <g class="chip-3">
    <rect x="150" y="248" width="420" height="40" rx="6" fill="#FFEBEE" stroke="#F44336" stroke-width="1.5"/>
    <text x="360" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#C62828" font-family="system-ui,sans-serif">parsing IDR → keyframe: decoding can (re)start here independently</text>
  </g>
  <g class="chip-4">
    <rect x="150" y="248" width="420" height="40" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
    <text x="360" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#E65100" font-family="system-ui,sans-serif">parsing P-slice → references earlier frames, cannot decode standalone</text>
  </g>

  <!-- bottom note -->
  <rect x="60" y="316" width="600" height="48" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="360" y="336" text-anchor="middle" font-size="10" fill="#455A64" font-family="system-ui,sans-serif">Start code 00 00 01 / 00 00 00 01 delimits NALUs; the first byte after it is the 1-byte NALU header (F | NRI | Type).</text>
  <text x="360" y="354" text-anchor="middle" font-size="10" fill="#455A64" font-family="system-ui,sans-serif">A payload containing 00 00 03 forces emulation-prevention insertion so it can't be mistaken for a start code.</text>
</svg>
{{- else -}}
<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="H.264 NALU 字节流解析动画">

  <rect width="720" height="380" fill="#fafafa" rx="8"/>
  <text x="360" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">H.264 裸码流：起始码把字节流切成一个个 NALU</text>

  <!-- 图例 -->
  <text x="460" y="44" font-size="9" fill="#9E9E9E" font-family="system-ui,sans-serif">■ 起始码</text>
  <rect x="516" y="36" width="8" height="8" fill="#EF9A9A"/>
  <text x="532" y="44" font-size="9" fill="#9E9E9E" font-family="system-ui,sans-serif">■ NALU 头</text>
  <rect x="604" y="36" width="8" height="8" fill="#90CAF9"/>
  <text x="620" y="44" font-size="9" fill="#9E9E9E" font-family="system-ui,sans-serif">■ 载荷</text>
  <rect x="682" y="36" width="8" height="8" fill="#CFD8DC"/>

  <!-- 第一行字节 -->
  <text x="50" y="70" font-size="14" font-family="monospace" fill="#C62828" font-weight="700">00 00 00 01</text>
  <text x="151" y="70" font-size="14" font-family="monospace" fill="#1565C0" font-weight="700">67</text>
  <text x="168" y="70" font-size="14" font-family="monospace" fill="#90A4AE">64 00 1e …</text>
  <text x="430" y="70" font-size="14" font-family="monospace" fill="#C62828" font-weight="700">00 00 00 01</text>
  <text x="531" y="70" font-size="14" font-family="monospace" fill="#1565C0" font-weight="700">68</text>
  <text x="548" y="70" font-size="14" font-family="monospace" fill="#90A4AE">eb e3 …</text>

  <!-- 第一行括号与标签 -->
  <g class="g-1">
    <path d="M 50 78 v 6 h 210 v -6" fill="none" stroke="#2196F3" stroke-width="1.6"/>
    <text x="155" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#1565C0" font-family="system-ui,sans-serif">NALU #1 · SPS（Type 7）序列参数集</text>
    <text x="155" y="115" text-anchor="middle" font-size="8.5" fill="#546E7A" font-family="monospace">67 = 0110 0111b → F:0 NRI:3 Type:7</text>
  </g>
  <g class="g-2">
    <path d="M 430 78 v 6 h 185 v -6" fill="none" stroke="#9C27B0" stroke-width="1.6"/>
    <text x="522" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#6A1B9A" font-family="system-ui,sans-serif">NALU #2 · PPS（Type 8）图像参数集</text>
    <text x="522" y="115" text-anchor="middle" font-size="8.5" fill="#546E7A" font-family="monospace">68 = 0110 1000b → Type:8</text>
  </g>

  <!-- 第二行字节 -->
  <text x="50" y="162" font-size="14" font-family="monospace" fill="#C62828" font-weight="700">00 00 00 01</text>
  <text x="151" y="162" font-size="14" font-family="monospace" fill="#1565C0" font-weight="700">65</text>
  <text x="168" y="162" font-size="14" font-family="monospace" fill="#90A4AE">b8 40 …</text>
  <text x="430" y="162" font-size="14" font-family="monospace" fill="#C62828" font-weight="700">00 00 01</text>
  <text x="506" y="162" font-size="14" font-family="monospace" fill="#1565C0" font-weight="700">41</text>
  <text x="523" y="162" font-size="14" font-family="monospace" fill="#90A4AE">9a 2c …</text>

  <!-- 第二行括号与标签 -->
  <g class="g-3">
    <path d="M 50 170 v 6 h 210 v -6" fill="none" stroke="#F44336" stroke-width="1.6"/>
    <text x="155" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#C62828" font-family="system-ui,sans-serif">NALU #3 · IDR Slice（Type 5）关键帧</text>
    <text x="155" y="207" text-anchor="middle" font-size="8.5" fill="#546E7A" font-family="monospace">65 = 0110 0101b → Type:5</text>
  </g>
  <g class="g-4">
    <path d="M 430 170 v 6 h 170 v -6" fill="none" stroke="#FF9800" stroke-width="1.6"/>
    <text x="515" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#E65100" font-family="system-ui,sans-serif">NALU #4 · 非 IDR Slice（Type 1）P 帧</text>
    <text x="515" y="207" text-anchor="middle" font-size="8.5" fill="#546E7A" font-family="monospace">41 = 0100 0001b → Type:1</text>
  </g>

  <!-- 解析光标 -->
  <rect class="cur-1" x="42" y="54" width="12" height="24" rx="2" fill="#FFD54F" fill-opacity="0.9"/>
  <rect class="cur-2" x="42" y="146" width="12" height="24" rx="2" fill="#FFD54F" fill-opacity="0.9"/>

  <!-- 状态条 -->
  <g class="chip-1">
    <rect x="150" y="248" width="420" height="40" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
    <text x="360" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#1565C0" font-family="system-ui,sans-serif">解析 SPS → 分辨率 / Profile / Level（整个序列）</text>
  </g>
  <g class="chip-2">
    <rect x="150" y="248" width="420" height="40" rx="6" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
    <text x="360" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#6A1B9A" font-family="system-ui,sans-serif">解析 PPS → 熵编码类型 / 初始 QP（一组图像）</text>
  </g>
  <g class="chip-3">
    <rect x="150" y="248" width="420" height="40" rx="6" fill="#FFEBEE" stroke="#F44336" stroke-width="1.5"/>
    <text x="360" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#C62828" font-family="system-ui,sans-serif">解析 IDR → 关键帧：解码可以从这里独立（重新）开始</text>
  </g>
  <g class="chip-4">
    <rect x="150" y="248" width="420" height="40" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
    <text x="360" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#E65100" font-family="system-ui,sans-serif">解析 P 帧 Slice → 要参考前面的帧，不能独立解码</text>
  </g>

  <!-- 底部注释 -->
  <rect x="60" y="316" width="600" height="48" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="360" y="336" text-anchor="middle" font-size="10" fill="#455A64" font-family="system-ui,sans-serif">起始码 00 00 01 / 00 00 00 01 划定 NALU 边界；其后第一个字节是 1 字节 NALU 头（F | NRI | Type）。</text>
  <text x="360" y="354" text-anchor="middle" font-size="10" fill="#455A64" font-family="system-ui,sans-serif">载荷中出现 00 00 03 时要插入防竞争字节，避免被误认成起始码。</text>
</svg>
{{- end -}}
