{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="TSDB 索引查询过程动画演示">
<style>
  @keyframes tS1 { 0%,18%{opacity:1;animation-timing-function:step-end} 19%,100%{opacity:0} }
  @keyframes tS2 { 0%,18%{opacity:0;animation-timing-function:step-end} 19%,38%{opacity:1;animation-timing-function:step-end} 39%,100%{opacity:0} }
  @keyframes tS3 { 0%,38%{opacity:0;animation-timing-function:step-end} 39%,58%{opacity:1;animation-timing-function:step-end} 59%,100%{opacity:0} }
  @keyframes tS4 { 0%,58%{opacity:0;animation-timing-function:step-end} 59%,100%{opacity:1} }
  .t-s1 { animation: tS1 20s infinite }
  .t-s2 { animation: tS2 20s infinite }
  .t-s3 { animation: tS3 20s infinite }
  .t-s4 { animation: tS4 20s infinite }
</style>
<rect width="720" height="440" fill="#fafafa" rx="8"/>
<text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">TSDB Index Query Flow</text>
<rect x="30" y="38" width="660" height="30" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
<text x="360" y="57" text-anchor="middle" font-size="13" fill="#1565C0" font-family="monospace">Query: {app=&quot;api&quot;} |= &quot;error&quot;</text>
<rect x="30" y="82" width="200" height="26" rx="4" fill="#1565C0"/>
<text x="130" y="99" text-anchor="middle" font-size="12" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">Postings Offset Table</text>
<rect x="255" y="82" width="200" height="26" rx="4" fill="#7B1FA2"/>
<text x="355" y="99" text-anchor="middle" font-size="12" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">Postings</text>
<rect x="480" y="82" width="210" height="26" rx="4" fill="#2E7D32"/>
<text x="585" y="99" text-anchor="middle" font-size="12" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">Series + Chunk Ref</text>
<rect x="30" y="118" width="200" height="34" rx="3" fill="#FFF8E1" stroke="#FFB300" stroke-width="1"/>
<text x="130" y="139" text-anchor="middle" font-size="12" fill="#E65100" font-family="monospace">app=api -> @0x100</text>
<rect x="255" y="118" width="200" height="34" rx="3" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1"/>
<text x="355" y="139" text-anchor="middle" font-size="12" fill="#6A1B9A" font-family="monospace">app=api -> [0, 2]</text>
<rect x="480" y="118" width="210" height="34" rx="3" fill="#E8F5E9" stroke="#81C784" stroke-width="1"/>
<text x="585" y="130" text-anchor="middle" font-size="10.5" fill="#2E7D32" font-family="monospace">series_0: {app=api,env=prod}</text>
<text x="585" y="146" text-anchor="middle" font-size="10" fill="#2E7D32" font-family="monospace">-> chunk_[t1, t5]</text>
<rect x="30" y="164" width="200" height="34" rx="3" fill="#FFF8E1" stroke="#FFB300" stroke-width="1"/>
<text x="130" y="185" text-anchor="middle" font-size="12" fill="#E65100" font-family="monospace">app=web -> @0x200</text>
<rect x="255" y="164" width="200" height="34" rx="3" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1"/>
<text x="355" y="185" text-anchor="middle" font-size="12" fill="#6A1B9A" font-family="monospace">app=web -> [1]</text>
<rect x="480" y="164" width="210" height="34" rx="3" fill="#E8F5E9" stroke="#81C784" stroke-width="1"/>
<text x="585" y="176" text-anchor="middle" font-size="10.5" fill="#2E7D32" font-family="monospace">series_1: {app=web,env=prod}</text>
<text x="585" y="192" text-anchor="middle" font-size="10" fill="#2E7D32" font-family="monospace">-> chunk_[t3]</text>
<rect x="30" y="210" width="200" height="34" rx="3" fill="#FFF8E1" stroke="#FFB300" stroke-width="1"/>
<text x="130" y="231" text-anchor="middle" font-size="12" fill="#E65100" font-family="monospace">env=prod -> @0x300</text>
<rect x="255" y="210" width="200" height="34" rx="3" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1"/>
<text x="355" y="231" text-anchor="middle" font-size="12" fill="#6A1B9A" font-family="monospace">env=prod -> [0,1,2]</text>
<rect x="480" y="210" width="210" height="34" rx="3" fill="#E8F5E9" stroke="#81C784" stroke-width="1"/>
<text x="585" y="222" text-anchor="middle" font-size="10.5" fill="#2E7D32" font-family="monospace">series_2: {app=api,env=prod}</text>
<text x="585" y="238" text-anchor="middle" font-size="10" fill="#2E7D32" font-family="monospace">-> chunk_[t6, t8]</text>
<g class="t-s2"><line x1="230" y1="135" x2="253" y2="135" stroke="#FF9800" stroke-width="2" marker-end="url(#aO)"/></g>
<g class="t-s3"><line x1="455" y1="135" x2="478" y2="125" stroke="#FF9800" stroke-width="2" marker-end="url(#aO)"/><line x1="455" y1="135" x2="478" y2="227" stroke="#FF9800" stroke-width="2" marker-end="url(#aO)"/></g>
<g class="t-s1"><line x1="130" y1="68" x2="130" y2="116" stroke="#2196F3" stroke-width="2" marker-end="url(#aB)"/></g>
<g class="t-s1"><rect x="30" y="270" width="660" height="40" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/><text x="360" y="295" text-anchor="middle" font-size="12.5" fill="#1565C0" font-family="system-ui,sans-serif">(1) Look up app=api in Postings Offset Table -> offset 0x100</text></g>
<g class="t-s2"><rect x="30" y="270" width="660" height="40" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/><text x="360" y="295" text-anchor="middle" font-size="12.5" fill="#1565C0" font-family="system-ui,sans-serif">(2) Read Postings at 0x100 -> matching series IDs: [0, 2]</text></g>
<g class="t-s3"><rect x="30" y="270" width="660" height="56" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/><text x="360" y="291" text-anchor="middle" font-size="12.5" fill="#1565C0" font-family="system-ui,sans-serif">(3) Resolve series_0 and series_2 -> get full label sets</text><text x="360" y="311" text-anchor="middle" font-size="12.5" fill="#1565C0" font-family="system-ui,sans-serif">and corresponding chunk references (path + time range)</text></g>
<g class="t-s4"><rect x="30" y="270" width="660" height="56" rx="6" fill="#E8F5E9" stroke="#66BB6A" stroke-width="2"/><text x="360" y="291" text-anchor="middle" font-size="12.5" fill="#2E7D32" font-family="system-ui,sans-serif">Complete query path: {app=&quot;api&quot;}</text><text x="360" y="311" text-anchor="middle" font-size="12.5" fill="#2E7D32" font-family="system-ui,sans-serif">-> Offset Table -> Postings [0,2] -> Series Chunks [t1,t5] &amp; [t6,t8]</text></g>
<defs><marker id="aB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2196F3"/></marker><marker id="aO" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#FF9800"/></marker></defs>
</svg>
