{{- /* Loki Chunk storage lifecycle animation. Single source of truth. */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="Loki Chunk Storage Lifecycle Animation">
<style>
  @keyframes fillBuffer {
    0%, 22% { transform: scaleX(0); }
    37%, 44% { transform: scaleX(1); }
    48%, 100% { transform: scaleX(0); }
  }
  @keyframes fade256kb {
    0%, 25% { opacity: 0; }
    28%, 44% { opacity: 1; }
    48%, 100% { opacity: 0; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  @keyframes moveChunk {
    0%, 30% { transform: translate(0, 0); }
    42%, 48% { transform: translate(310px, 0); }
    100% { transform: translate(0, 0); }
  }
  @keyframes moveChunkText {
    0%, 30% { transform: translate(0, 0); }
    42%, 48% { transform: translate(310px, 0); }
    100% { transform: translate(0, 0); }
  }
  .anim-fill { transform-origin: 190px 158px; animation: fillBuffer 8s infinite; }
  .anim-fade { animation: fade256kb 8s infinite; }
  .anim-pulse { animation: pulse 1.5s ease-in-out infinite; }
  .anim-chunk { animation: moveChunk 8s infinite; }
  .anim-chunk-text { animation: moveChunkText 8s infinite; }
</style>
  <rect width="720" height="380" fill="#fafafa" rx="8"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">Loki Chunk Storage Lifecycle</text>
  <line x1="360" y1="96" x2="360" y2="280" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="30" y="48" font-size="11" font-weight="600" fill="#9E9E9E" font-family="system-ui,sans-serif">① Log stream arrives at Ingester</text>
  <rect x="120" y="54" width="480" height="22" rx="4" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="130" y="69" font-size="10" fill="#1565C0" font-family="monospace" font-weight="600">[INFO] request started | [ERROR] db fail | [WARN] retrying...</text>
  <text x="360" y="92" text-anchor="middle" font-size="10" fill="#9E9E9E" font-family="system-ui,sans-serif">Log stream flowing continuously, Ingester accumulating in memory</text>
  <text x="360" y="108" text-anchor="middle" font-size="14" fill="#BDBDBD">↓</text>
  <text x="30" y="118" font-size="11" font-weight="600" fill="#9E9E9E" font-family="system-ui,sans-serif">② Ingester memory buffer filling up</text>
  <rect x="180" y="124" width="360" height="56" rx="6" fill="#FFF8E1" stroke="#FF9800" stroke-width="1.5"/>
  <text x="360" y="142" text-anchor="middle" font-size="11" fill="#E65100" font-weight="600" font-family="system-ui,sans-serif">Ingester Memory Buffer (~256KB)</text>
  <rect x="190" y="151" width="340" height="14" rx="3" fill="#FFE0B2"/>
  <rect class="anim-fill" x="190" y="151" width="340" height="14" rx="3" fill="#FF9800" opacity="0.6"/>
  <text class="anim-fade" x="520" y="155" font-size="8" fill="#E65100" font-family="system-ui,sans-serif" font-weight="600">256KB</text>
  <text x="360" y="196" text-anchor="middle" font-size="14" fill="#BDBDBD">↓</text>
  <text x="30" y="206" font-size="11" font-weight="600" fill="#9E9E9E" font-family="system-ui,sans-serif">③ Compressed into Chunk (~10x)</text>
  <rect x="110" y="212" width="120" height="28" rx="4" fill="#FFCDD2" stroke="#F44336" stroke-width="1.5"/>
  <text x="170" y="231" text-anchor="middle" font-size="10" fill="#C62828" font-weight="600" font-family="system-ui,sans-serif">~256KB uncompressed</text>
  <text class="anim-pulse" x="280" y="232" text-anchor="middle" font-size="18" fill="#4CAF50" font-weight="bold">→</text>
  <text x="280" y="248" text-anchor="middle" font-size="9" fill="#2E7D32" font-family="system-ui,sans-serif">gzip/snappy</text>
  <rect x="360" y="217" width="100" height="22" rx="6" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/>
  <text x="410" y="233" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="600" font-family="system-ui,sans-serif">~25KB Chunk</text>
  <rect x="490" y="218" width="46" height="16" rx="8" fill="#9C27B0"/>
  <text x="513" y="230" text-anchor="middle" font-size="9" fill="#fff" font-weight="600" font-family="system-ui,sans-serif">~10x</text>
  <text x="410" y="270" text-anchor="middle" font-size="14" fill="#BDBDBD">↓</text>
  <text x="30" y="278" font-size="11" font-weight="600" fill="#9E9E9E" font-family="system-ui,sans-serif">④ Flush to Object Storage</text>
  <rect class="anim-chunk" x="140" y="286" width="80" height="24" rx="6" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/>
  <text class="anim-chunk-text" x="180" y="302" text-anchor="middle" font-size="9" fill="#2E7D32" font-weight="600" font-family="system-ui,sans-serif">Chunk</text>
  <ellipse cx="540" cy="298" rx="60" ry="26" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
  <text x="540" y="294" text-anchor="middle" font-size="11" fill="#1565C0" font-weight="600" font-family="system-ui,sans-serif">Object Storage</text>
  <text x="540" y="310" text-anchor="middle" font-size="9" fill="#1565C0" font-family="system-ui,sans-serif">S3 / GCS</text>
  <line x1="30" y1="328" x2="690" y2="328" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="70" y="334" width="580" height="38" rx="4" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="360" y="348" text-anchor="middle" font-size="10" fill="#2E7D32" font-family="system-ui,sans-serif">✓ Loki: stores compressed chunks + label-only index → low cost</text>
  <text x="360" y="364" text-anchor="middle" font-size="10" fill="#C62828" font-family="system-ui,sans-serif">✕ ES: builds inverted index per log entry → 10x+ storage cost</text>
</svg>
{{- else -}}
