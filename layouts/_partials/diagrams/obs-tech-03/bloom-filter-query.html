{{- /* animated SVG, single source of truth for zh/en */ -}}
{{- $lang := .lang | default "zh-cn" -}}
{{- if eq $lang "en" -}}
<svg viewBox="0 0 720 310" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;margin:1.5em auto;display:block;" role="img" aria-label="VictoriaLogs Bloom Filter query filtering flow animation">
<style>
  @keyframes bfS1 { 0%,20%{opacity:1;animation-timing-function:step-end} 21%,100%{opacity:0} }
  @keyframes bfS2 { 0%,20%{opacity:0;animation-timing-function:step-end} 21%,40%{opacity:1;animation-timing-function:step-end} 41%,100%{opacity:0} }
  @keyframes bfS3 { 0%,40%{opacity:0;animation-timing-function:step-end} 41%,65%{opacity:1;animation-timing-function:step-end} 66%,100%{opacity:0} }
  @keyframes bfS4 { 0%,65%{opacity:0;animation-timing-function:step-end} 66%,100%{opacity:1} }
  .bf-s1 { animation: bfS1 20s infinite; }
  .bf-s2 { animation: bfS2 20s infinite; }
  .bf-s3 { animation: bfS3 20s infinite; }
  .bf-s4 { animation: bfS4 20s infinite; }
</style>
<rect width="720" height="310" fill="#fafafa" rx="8"/>
<text x="360" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#424242" font-family="system-ui,sans-serif">VictoriaLogs Bloom Filter Query Flow</text>
<!-- Query box -->
<rect x="250" y="38" width="220" height="30" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
<text x="360" y="57" text-anchor="middle" font-size="13" fill="#1565C0" font-family="monospace">Query: status=500</text>
<!-- Partition label -->
<text x="360" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#9E9E9E" font-family="system-ui,sans-serif">Blocks (sorted by time + stream)</text>
<!-- 6 blocks in two rows -->
<rect x="30" y="100" width="206" height="50" rx="4" fill="#FFF8E1" stroke="#FFB300" stroke-width="1"/>
<text x="133" y="120" text-anchor="middle" font-size="11" fill="#E65100" font-family="monospace">Block A</text>
<text x="133" y="138" text-anchor="middle" font-size="10" fill="#E65100" font-family="monospace">stream: api | 10:00-10:05</text>
<rect x="250" y="100" width="206" height="50" rx="4" fill="#FFF8E1" stroke="#FFB300" stroke-width="1"/>
<text x="353" y="120" text-anchor="middle" font-size="11" fill="#E65100" font-family="monospace">Block B</text>
<text x="353" y="138" text-anchor="middle" font-size="10" fill="#E65100" font-family="monospace">stream: api | 10:05-10:10</text>
<rect x="470" y="100" width="206" height="50" rx="4" fill="#FFF8E1" stroke="#FFB300" stroke-width="1"/>
<text x="573" y="120" text-anchor="middle" font-size="11" fill="#E65100" font-family="monospace">Block C</text>
<text x="573" y="138" text-anchor="middle" font-size="10" fill="#E65100" font-family="monospace">stream: api | 10:10-10:15</text>
<rect x="30" y="158" width="206" height="50" rx="4" fill="#FFF8E1" stroke="#FFB300" stroke-width="1"/>
<text x="133" y="178" text-anchor="middle" font-size="11" fill="#E65100" font-family="monospace">Block D</text>
<text x="133" y="196" text-anchor="middle" font-size="10" fill="#E65100" font-family="monospace">stream: api | 10:15-10:20</text>
<rect x="250" y="158" width="206" height="50" rx="4" fill="#FFF8E1" stroke="#FFB300" stroke-width="1"/>
<text x="353" y="178" text-anchor="middle" font-size="11" fill="#E65100" font-family="monospace">Block E</text>
<text x="353" y="196" text-anchor="middle" font-size="10" fill="#E65100" font-family="monospace">stream: web | 10:05-10:10</text>
<rect x="470" y="158" width="206" height="50" rx="4" fill="#FFF8E1" stroke="#FFB300" stroke-width="1"/>
<text x="573" y="178" text-anchor="middle" font-size="11" fill="#E65100" font-family="monospace">Block F</text>
<text x="573" y="196" text-anchor="middle" font-size="10" fill="#E65100" font-family="monospace">stream: web | 10:10-10:15</text>
<!-- Stage 1: Query enters → time filter -->
<g class="bf-s1">
<rect x="30" y="228" width="660" height="40" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
<text x="360" y="253" text-anchor="middle" font-size="12.5" fill="#1565C0" font-family="system-ui,sans-serif">(1) Query enters, time-range filter → partition 2026/01/09</text>
<line x1="30" y1="268" x2="30" y2="150" stroke="#2196F3" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
</g>
<!-- Stage 2: metaindex → stream filter -->
<g class="bf-s2">
<rect x="30" y="228" width="660" height="40" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
<text x="360" y="253" text-anchor="middle" font-size="12.5" fill="#1565C0" font-family="system-ui,sans-serif">(2) metaindex stream filter → Block A~D match api stream</text>
<line x1="30" y1="268" x2="30" y2="125" stroke="#2196F3" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
<line x1="250" y1="268" x2="250" y2="125" stroke="#2196F3" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
<line x1="470" y1="268" x2="470" y2="125" stroke="#2196F3" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
<line x1="133" y1="268" x2="133" y2="183" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
<line x1="353" y1="268" x2="353" y2="183" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
<line x1="573" y1="268" x2="573" y2="183" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
</g>
<!-- Stage 3: Bloom filter check -->
<g class="bf-s3">
<rect x="30" y="228" width="660" height="40" rx="6" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.5"/>
<text x="360" y="253" text-anchor="middle" font-size="12.5" fill="#2E7D32" font-family="system-ui,sans-serif">(3) Bloom filter checks "500" → Block A/C/D pass, Block B fail</text>
<rect x="36" y="106" width="194" height="38" rx="3" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" opacity="0.85"/>
<circle cx="210" cy="115" r="8" fill="#4CAF50"/>
<text x="210" y="119" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">✓</text>
<rect x="256" y="106" width="194" height="38" rx="3" fill="#FFEBEE" stroke="#F44336" stroke-width="2" opacity="0.85"/>
<circle cx="430" cy="115" r="8" fill="#F44336"/>
<text x="430" y="119" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">✗</text>
<rect x="476" y="106" width="194" height="38" rx="3" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" opacity="0.85"/>
<circle cx="650" cy="115" r="8" fill="#4CAF50"/>
<text x="650" y="119" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">✓</text>
<rect x="36" y="164" width="194" height="38" rx="3" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" opacity="0.85"/>
<circle cx="210" cy="173" r="8" fill="#4CAF50"/>
<text x="210" y="177" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">✓</text>
</g>
<!-- Stage 4: Read passing blocks -->
<g class="bf-s4">
<rect x="30" y="228" width="660" height="56" rx="6" fill="#E8F5E9" stroke="#66BB6A" stroke-width="2"/>
<text x="360" y="251" text-anchor="middle" font-size="12.5" fill="#2E7D32" font-family="system-ui,sans-serif">(4) Read values from passing blocks only → scan 3/6 blocks</text>
<text x="360" y="271" text-anchor="middle" font-size="12.5" fill="#2E7D32" font-family="system-ui,sans-serif">Result: Found status=500 log lines in Block A, C, D</text>
</g>
<defs><marker id="aB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2196F3"/></marker></defs>
</svg>
{{- else -}}
