{{ define "main" }}
  {{ $p := .Paginate (sort (where site.RegularPages "Type" "==" "posts") "Date" "desc") }}
  <div class="post-list">
    {{ range $p.Pages }}
      {{ partial "post/card.html" (dict "page" .) }}
    {{ end }}
  </div>
  {{ partial "pagination.html" (dict "Paginator" $p) }}
{{ end }}
