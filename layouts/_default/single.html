{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      {{ partial "post/meta.html" . }}
    </header>
    <div class="Content">
      {{ .Content }}
    </div>
    {{ partial "post/series-nav.html" . }}
    {{ partial "post/footer.html" . }}
  </article>
{{ end }}
